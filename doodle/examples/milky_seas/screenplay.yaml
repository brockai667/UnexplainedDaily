    - {line: [[-60, -30], [-18, -52]], stroke: "#eafff8", width: 18}
    - {line: [[30, 20], [72, 26]], stroke: "#5df2c8", width: 30}
    - {line: [[30, 20], [72, 26]], stroke: "#eafff8", width: 18}
    - {line: [[-30, 60], [-46, 100]], stroke: "#5df2c8", width: 30}
    - {line: [[-30, 60], [-46, 100]], stroke: "#eafff8", width: 18}
    - {line: [[50, -70], [90, -40]], stroke: "#5df2c8", width: 30}
    - {line: [[50, -70], [90, -40]], stroke: "#eafff8", width: 18}
    - {group: d1, pivot: [-39, -41], items: [{line: [[-60, -30], [-18, -52]], stroke: "#111111", width: 30}, {line: [[-60, -30], [-18, -52]], stroke: "#2c5f56", width: 18}]}
    - {group: d2, pivot: [51, 23], items: [{line: [[30, 20], [72, 26]], stroke: "#111111", width: 30}, {line: [[30, 20], [72, 26]], stroke: "#2c5f56", width: 18}]}
    - {group: d3, pivot: [-38, 80], items: [{line: [[-30, 60], [-46, 100]], stroke: "#111111", width: 30}, {line: [[-30, 60], [-46, 100]], stroke: "#2c5f56", width: 18}]}
    - {group: d4, pivot: [70, -55], items: [{line: [[50, -70], [90, -40]], stroke: "#111111", width: 30}, {line: [[50, -70], [90, -40]], stroke: "#2c5f56", width: 18}]}

  swarmC:
    - {line: [[-80, -20], [-36, -30]], stroke: "#5df2c8", width: 30}
    - {line: [[-80, -20], [-36, -30]], stroke: "#eafff8", width: 18}
    - {line: [[20, -60], [44, -22]], stroke: "#5df2c8", width: 30}
    - {line: [[20, -60], [44, -22]], stroke: "#eafff8", width: 18}
    - {line: [[-10, 40], [34, 62]], stroke: "#5df2c8", width: 30}
    - {line: [[-10, 40], [34, 62]], stroke: "#eafff8", width: 18}
    - {line: [[-96, 70], [-60, 92]], stroke: "#5df2c8", width: 30}
    - {line: [[-96, 70], [-60, 92]], stroke: "#eafff8", width: 18}
    - {group: d1, pivot: [-58, -25], items: [{line: [[-80, -20], [-36, -30]], stroke: "#111111", width: 30}, {line: [[-80, -20], [-36, -30]], stroke: "#2c5f56", width: 18}]}
    - {group: d2, pivot: [32, -41], items: [{line: [[20, -60], [44, -22]], stroke: "#111111", width: 30}, {line: [[20, -60], [44, -22]], stroke: "#2c5f56", width: 18}]}
    - {group: d3, pivot: [12, 51], items: [{line: [[-10, 40], [34, 62]], stroke: "#111111", width: 30}, {line: [[-10, 40], [34, 62]], stroke: "#2c5f56", width: 18}]}
    - {group: d4, pivot: [-78, 81], items: [{line: [[-96, 70], [-60, 92]], stroke: "#111111", width: 30}, {line: [[-96, 70], [-60, 92]], stroke: "#2c5f56", width: 18}]}

  switchplate:                               # big wall light switch, origin = centre of the plate
    - {rect: [-150, -210, 300, 420, 28], fill: "#f4f1e8", width: 9}
    - {circle: [0, -172, 14], fill: "#b0b0b0", width: 4}
    - {line: [[-9, -172], [9, -172]], width: 4}
    - {circle: [0, 172, 14], fill: "#b0b0b0", width: 4}
    - {line: [[-9, 172], [9, 172]], width: 4}
    - {circle: [0, 40, 58], fill: "#cfcfc5", width: 8}
    - {group: lever, pivot: [0, 40], items: [
        {rect: [-15, -128, 30, 168, 12], fill: "#9e9e9e", width: 7},
        {circle: [0, -136, 30], fill: "#e63946", width: 7}]}

  hand:                                      # pushing hand, origin = centre of the palm, fingers point right
    - {rect: [-300, -36, 270, 72, 8], fill: "#3d5a80", width: 6}
    - {ellipse: [0, 0, 46, 40], fill: "#ffd7b5", width: 6}
    - {line: [[26, -24], [84, -24]], stroke: "#222222", width: 24}
    - {line: [[26, -24], [84, -24]], stroke: "#ffd7b5", width: 13}
    - {line: [[26, -6], [92, -6]], stroke: "#222222", width: 24}
    - {line: [[26, -6], [92, -6]], stroke: "#ffd7b5", width: 13}
    - {line: [[26, 12], [88, 12]], stroke: "#222222", width: 24}
    - {line: [[26, 12], [88, 12]], stroke: "#ffd7b5", width: 13}
    - {line: [[26, 28], [76, 28]], stroke: "#222222", width: 22}
    - {line: [[26, 28], [76, 28]], stroke: "#ffd7b5", width: 12}

scenes:
  # ---------------------------------------------------------------- A: the old sailor tells his story on the quay (s1)
  - id: quay1
    sents: [s1]
    set:
      - {kind: sky, clouds: [[110, 210, 130], [580, 330, 110]], drift: 8}
      - {kind: shape, shape: harbour, x: 0, y: 0}
    props:
      - {id: bubble, kind: shape, shape: bubble, x: 300, y: 520, scale: 0.05, hidden: true}
      - {id: gulls, kind: emitter, emitter: birds, at: [560, 300]}
    cast:
      - {id: lis2, x: 590, gy: 902, k: 1.1, facing: l, hat: [red, yellow], face: curious}
      - {id: lis1, x: 470, gy: 902, k: 1.2, facing: l, hair: "#6d4c41", coat: "#52796f", coat_len: 20, face: curious}
      - {id: sailor, x: 240, gy: 902, k: 1.5, facing: r, cap: navy, coat: "#3d5a80", coat_len: 30, hair: "#9e9e9e", face: happy}
    beats:
      - {at: 0.05, who: lis1, do: pose, name: lean_in}
      - {at: 0.12, who: lis2, do: pose, name: lean_in}
      - {at: 0.1, who: sailor, do: pose, name: hands_up}
      - {at: "word:centuries", who: gulls, do: burst}
      - {at: "word:sailors-0.1", who: sailor, do: pose, name: wave}
      - {at: "word:sailors-0.05", who: bubble, do: show}
      - {at: prev, who: bubble, do: scale, to: 1, dur: 1.1, ease: back.out(1.5)}
      - {at: "word:told", who: sailor, do: pose, name: reach}
      - {at: "word:same", who: sailor, do: pose, name: hands_up}
      - {at: "word:same", who: lis1, do: nod, until: "word:story"}
      - {at: "word:same+0.1", who: lis2, do: nod, until: "word:story"}
      - {at: "word:strange", who: sailor, do: point, target: bubble}
      - {at: "word:strange", who: cam, do: push, zoom: 1.12, target: [340, 520], screen: [360, 570], dur: 1.4, ease: sine.inOut}
      - {at: "word:story-0.1", who: sailor, do: pose, name: hands_up}

  # ---------------------------------------------------------------- B: night at sea, the water starts to glow (s2, s3)
  - id: night
    sents: [s2, s3]
    in: {type: slide}
    camera: {zoom: 1.55, at: [400, 730], screen: [360, 620]}
    set:
      - {kind: shape, shape: seadark, x: 0, y: 0}
      - {id: glowE, kind: shape, shape: glowdisc, x: 360, y: 812, scale: 0.05}
      - {kind: shape, shape: nightsky, x: 0, y: 0}
      - {kind: shape, shape: moon, x: 540, y: 430}
      - {id: wa, kind: shape, shape: wavesA, x: 0, y: 0}
      - {id: ship, kind: shape, shape: galleon, x: 360, y: 812}
      - {id: fd, kind: shape, shape: frontD, x: 0, y: 0}
      - {id: fg, kind: shape, shape: frontG, x: 0, y: 0, opacity: 0}
      - {id: wb, kind: shape, shape: wavesB, x: 0, y: 0}
    props:
      - {id: rail, kind: shape, shape: shiprail, x: 360, y: 812, layer: top}
      - {id: hz, kind: line, points: [[20, 612], [700, 612]], style: dash, width: 5, color: white, arrows: both}
    cast:
      - {id: sa1, x: 400, gy: 742, k: 0.95, facing: r, cap: "#264653", coat: "#52796f", coat_len: 14, face: ok}
      - {id: sa2, x: 480, gy: 742, k: 0.95, facing: r, hat: [teal, "#e9c46a"], face: ok}
    beats:
      - {at: scene, who: ship, do: rock, amp: 2.0, freq: 0.32}
      - {at: scene, who: rail, do: rock, amp: 2.0, freq: 0.32}
      - {at: scene, who: sa1, do: rock, amp: 2.0, freq: 0.32}
      - {at: scene, who: sa2, do: rock, amp: 2.0, freq: 0.32}
      - {at: scene, who: wa, do: bob, amp: 5, freq: 0.5}
      - {at: scene, who: wb, do: bob, amp: 6, freq: 0.42}
      - {at: scene, who: fd, do: bob, amp: 3, freq: 0.45}
      - {at: scene, who: fg, do: bob, amp: 3, freq: 0.45}
      - {at: scene, who: sa1, do: look, target: [600, 700]}
      - {at: scene, who: sa2, do: look, target: [600, 700]}
      - {at: "word:glow-0.2", who: glowE, do: scale, to: 14, dur: 2.3, ease: power2.out}
      - {at: "word:glow-0.2", who: fg, do: fade, to: 1, dur: 2.0}
      - {at: "word:glow", who: sa1, do: pose, name: lean_in}
      - {at: "word:glow", who: sa1, do: face, name: wow}
      - {at: "word:glow", who: sa1, do: look, target: down}
      - {at: "word:glow+0.12", who: sa2, do: pose, name: lean_in}
      - {at: "word:glow+0.12", who: sa2, do: face, name: wow}
      - {at: "word:glow+0.12", who: sa2, do: look, target: down}
      - {at: "word:milk", who: sa1, do: pose, name: cheeks}
      - {at: "word:milk+0.1", who: sa2, do: pose, name: cheeks}
      - {at: "word:steady-0.2", who: cam, do: pull, zoom: 1.0, target: [360, 640], screen: [360, 640], dur: 2.6, ease: sine.inOut}
      - {at: "word:horizon", who: hz, do: draw_line, dur: 0.9}

  # ---------------------------------------------------------------- C: back on the quay, nobody believes him (s4)
  - id: quay2
    sents: [s4]
    in: {type: slide}
    set:
      - {kind: sky, clouds: [[100, 230, 130], [600, 300, 110]], drift: 8}
      - {kind: shape, shape: harbour, x: 0, y: 0}
    props:
      - {id: pic, kind: shape, shape: pframe, x: 300, y: 400, scale: 0.05, hidden: true}
      - {id: x1, kind: shape, shape: redx, x: 300, y: 400, scale: 1.25, hidden: true, layer: top}
      - {id: doc, kind: shape, shape: sheet, x: 560, y: 400, scale: 0.05, hidden: true}
      - {id: x2, kind: shape, shape: redx, x: 560, y: 400, scale: 1.1, hidden: true, layer: top}
      - {id: hat, kind: shape, shape: tophat, on: gent, anchor: top, offset: [0, 2]}
    cast:
      - {id: scholar, x: 590, gy: 902, k: 1.2, facing: l, glasses: true, coat: "#6d4c41", coat_len: 40, hair: "#a3a3a3", face: happy}
      - {id: gent, x: 440, gy: 902, k: 1.25, facing: l, coat: "#1d1d1d", coat_len: 40, hair: "#3b2a1e", face: happy}
      - {id: sailor, x: 200, gy: 902, k: 1.5, facing: r, cap: navy, coat: "#3d5a80", coat_len: 30, hair: "#9e9e9e", face: worried}
    beats:
      - {at: scene, who: sailor, do: pose, name: hands_up}
      - {at: 0.15, who: gent, do: pose, name: wave}
      - {at: 0.3, who: scholar, do: pose, name: wave}
      - {at: "word:believed", who: gent, do: heave, until: "word:proof+0.6"}
      - {at: "word:believed", who: scholar, do: heave, until: "word:proof+0.6"}
      - {at: "word:believed+0.2", who: sailor, do: face, name: sad}
      - {at: "word:no", who: pic, do: show}
      - {at: prev, who: pic, do: scale, to: 1, dur: 0.5, ease: back.out(1.8)}
      - {at: "word:photograph", who: x1, do: stamp, from: 2.2, r0: -14, r1: -4}
      - {at: "word:no#2", who: doc, do: show}
      - {at: prev, who: doc, do: scale, to: 1, dur: 0.5, ease: back.out(1.8)}
      - {at: "word:proof", who: x2, do: stamp, from: 2.2, r0: -12, r1: -3}
      - {at: "word:proof+0.15", who: sailor, do: pose, name: shrug}

  # ---------------------------------------------------------------- D: 1995, a cargo ship crosses the glowing sea (s5)
  - id: cargo
    sents: [s5]
    in: {type: slide}
    set:
      - {kind: shape, shape: seapale, x: 0, y: 0}
      - {kind: shape, shape: nightsky, x: 0, y: 0}
      - {kind: shape, shape: moon, x: 610, y: 340}
      - {id: wa, kind: shape, shape: wavesA, x: 0, y: 0}
      - {id: ship, kind: shape, shape: cargo, x: 300, y: 800}
      - {id: fg, kind: shape, shape: frontG, x: 0, y: -14}
      - {id: wb, kind: shape, shape: wavesB, x: 0, y: 0}
    props:
      - {id: log, kind: shape, shape: logbook, x: 160, y: 488, scale: 1.4, layer: top}
    cast:
      - {id: officer, x: 113, gy: 588, k: 0.82, facing: r, cap: navy, coat: "#1d3557", coat_len: 26, hair: "#3b2a1e", face: flat}
    beats:
      - {at: scene, who: ship, do: move, dx: 330, dy: 0, dur: 4.6, ease: none}
      - {at: scene, who: officer, do: move, dx: 330, dy: 0, dur: 4.6, ease: none}
      - {at: scene, who: log, do: move, dx: 330, dy: 0, dur: 4.6, ease: none}
      - {at: scene, who: wa, do: bob, amp: 5, freq: 0.5}
      - {at: scene, who: wb, do: bob, amp: 6, freq: 0.42}
      - {at: scene, who: log.pen, do: rock, amp: 14, freq: 3.2}
      - {at: scene, who: officer, do: look, target: log}
      - {at: "word:merchant", who: officer, do: nod, until: "s5.end"}
      - {at: "word:glowing-0.2", who: cam, do: push, zoom: 1.25, target: [440, 560], screen: [360, 570], until: "s5.end", ease: sine.inOut}

  # ---------------------------------------------------------------- E: satellite, then the scientist at the monitor (s6, s7)
  - id: space
    sents: [s6, s7]
    in: {type: slide}
    set:
      - {kind: shape, shape: earth, x: 0, y: 0}
      - {kind: shape, shape: lab, x: 0, y: 0}
      - {kind: shape, shape: desk, x: 430, y: 1770}
      - {id: mon, kind: shape, shape: monitor, x: 480, y: 1367, scale: 1.3}
      - {id: satl, kind: shape, shape: sat, x: 140, y: 330, scale: 1.3}
    cast:
      - {id: sci, x: 190, gy: 1770, k: 1.5, facing: r, coat: true, glasses: true, hair: "#a3a3a3", face: flat}
    beats:
      - {at: scene, who: satl, do: path, points: [[140, 330], [260, 285], [470, 285], [620, 335]], dur: 2.6, ease: none}
      - {at: 0.15, who: satl.beam, do: rock, amp: 14, freq: 1.3, until: "word:scientists+0.6"}
      - {at: scene, who: mon.patch, do: fade, to: 0, dur: 0.01}
      - {at: "word:scientists+0.35", who: cam, do: tilt, zoom: 1.0, target: [360, 1590], screen: [360, 640], dur: 1.0, ease: power2.inOut}
      - {at: "word:found", who: sci, do: look, target: mon}
      - {at: "word:found", who: sci, do: point, target: mon}
      - {at: "word:old-0.1", who: mon.scan, do: move, dy: 176, dur: 1.2, ease: none}
      - {at: "word:satellite", who: mon.patch, do: fade, to: 1, dur: 0.6}
      - {at: "word:satellite", who: sci, do: sway, until: "word:glow"}
      - {at: "word:glow", who: sci, do: pose, name: hands_up}
      - {at: "word:glow", who: sci, do: face, name: wow}
      - {at: "word:glow", who: sci, do: move, dy: -80, dur: 0.22, ease: power2.out}
      - {at: prev.end, who: sci, do: move, dy: 80, dur: 0.25, ease: power2.in}
      - {at: "word:satellite+0.6", who: mon.patch, do: pulse, amp: 0.12, freq: 1.6, until: scene.end}
      - {at: "word:thousand", who: sci, do: move, dy: -80, dur: 0.22, ease: power2.out}
      - {at: prev.end, who: sci, do: move, dy: 80, dur: 0.25, ease: power2.in}

  # ---------------------------------------------------------------- F: zoom into the water, bacteria light up (s8)
  - id: bacteria
    sents: [s8]
    in: {type: zoom, target: [480, 1431], from: [360, 500]}
    set:
      - {kind: shape, shape: deepbg, x: 0, y: 0}
      - {kind: shape, shape: lens, x: 360, y: 500}
      - {id: halo, kind: shape, shape: halo, x: 360, y: 500, opacity: 0}
      - {id: swA, kind: shape, shape: swarmA, x: 300, y: 420, scale: 1.2}
      - {id: swB, kind: shape, shape: swarmB, x: 440, y: 540, scale: 1.2}
      - {id: swC, kind: shape, shape: swarmC, x: 320, y: 620, scale: 1.2}
    beats:
      - {at: scene, who: swA, do: move, dx: 40, dy: -30, dur: 4.4, ease: sine.inOut}
      - {at: scene, who: swB, do: move, dx: -50, dy: 25, dur: 4.4, ease: sine.inOut}
      - {at: scene, who: swC, do: move, dx: 45, dy: -35, dur: 4.4, ease: sine.inOut}
      - {at: "word:comes", who: swA.d1, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+0.15", who: swB.d1, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+0.3", who: swC.d1, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+0.45", who: swA.d2, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+0.6", who: swC.d2, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+0.75", who: swB.d2, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+0.9", who: swB.d3, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+1.05", who: swA.d3, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+1.2", who: swC.d3, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+1.35", who: swA.d4, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+1.5", who: swC.d4, do: fade, to: 0, dur: 0.25}
      - {at: "word:comes+1.65", who: swB.d4, do: fade, to: 0, dur: 0.25}
      - {at: "word:shining-0.1", who: halo, do: fade, to: 1, dur: 0.5}
      - {at: "word:shining", who: halo, do: pulse, amp: 0.1, freq: 2.0, until: scene.end}
      - {at: "word:shining", who: swA, do: pulse, amp: 0.12, freq: 2.0, until: scene.end}
      - {at: "word:shining", who: swB, do: pulse, amp: 0.12, freq: 2.0, until: scene.end}
      - {at: "word:shining", who: swC, do: pulse, amp: 0.12, freq: 2.0, until: scene.end}

  # ---------------------------------------------------------------- G: the moon crosses again and again, 40 nights (s9)
  - id: nights
    sents: [s9]
    in: {type: slide}
    set:
      - {kind: shape, shape: seapale, x: 0, y: 0}
      - {kind: shape, shape: nightsky, x: 0, y: 0}
      - {id: m1, kind: shape, shape: moon, x: -90, y: 440}
      - {id: m2, kind: shape, shape: moon, x: -90, y: 440}
      - {id: m3, kind: shape, shape: moon, x: -90, y: 440}
      - {id: m4, kind: shape, shape: moon, x: -90, y: 440}
      - {id: wa, kind: shape, shape: wavesA, x: 0, y: 0}
      - {id: ship, kind: shape, shape: cargo, x: 440, y: 800, scale: 0.6}      # 2019 = moderna lod, nie plachetnica
      - {id: fg, kind: shape, shape: frontG, x: 0, y: -10}
      - {id: wb, kind: shape, shape: wavesB, x: 0, y: 0}
    beats:
      - {at: scene, who: ship, do: rock, amp: 2.0, freq: 0.32}
      - {at: scene, who: wa, do: bob, amp: 5, freq: 0.5}
      - {at: scene, who: wb, do: bob, amp: 6, freq: 0.42}
      - {at: scene, who: fg, do: bob, amp: 3, freq: 0.45}
      - {at: scene, who: m1, do: path, points: [[-90, 440], [180, 240], [540, 240], [810, 440]], dur: 0.95, ease: none}
      - {at: "scene+0.95", who: m2, do: path, points: [[-90, 440], [180, 240], [540, 240], [810, 440]], dur: 0.95, ease: none}
      - {at: "scene+1.9", who: m3, do: path, points: [[-90, 440], [180, 240], [540, 240], [810, 440]], dur: 0.95, ease: none}
      - {at: "scene+2.85", who: m4, do: path, points: [[-90, 440], [180, 240], [540, 240], [810, 440]], dur: 0.95, ease: none}

  # ---------------------------------------------------------------- H: the big switch, the sea lights up, the question (s10)
  - id: finale
    sents: [s10]
    in: {type: slide}
    set:
      - {kind: shape, shape: seadark, x: 0, y: 0}
      - {id: glowE, kind: shape, shape: glowdisc, x: 360, y: 700, scale: 0.05}
      - {kind: shape, shape: nightsky, x: 0, y: 0}
      - {kind: shape, shape: moon, x: 110, y: 450}
      - {id: wa, kind: shape, shape: wavesA, x: 0, y: 0}
      - {id: wb, kind: shape, shape: wavesB, x: 0, y: 0}
      - {id: plate, kind: shape, shape: switchplate, x: 360, y: 560}
    props:
      - {id: hand, kind: shape, shape: hand, x: -250, y: 451}
    beats:
      - {at: scene, who: plate.lever, do: rotate, to: -32, dur: 0.01}
      - {at: scene, who: wa, do: bob, amp: 5, freq: 0.5}
      - {at: scene, who: wb, do: bob, amp: 6, freq: 0.42}
      - {at: "word:whole-0.3", who: hand, do: move, to: [145, 451], dur: 0.9, ease: power2.out}
      - {at: "word:switch-0.05", who: plate.lever, do: rotate, to: 32, dur: 0.35, ease: power2.inOut}
      - {at: "word:switch-0.05", who: hand, do: move, to: [331, 451], dur: 0.35, ease: power2.inOut}
      - {at: "word:switch+0.1", who: glowE, do: scale, to: 14, dur: 1.4, ease: power2.out}
