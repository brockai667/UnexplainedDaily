# Milky seas - the whole episode as data (python sp.py episodes/milky_seas)
title: Milky Seas
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s10.end+0.55", dur: 1.3}

sentences:
  s1: "For centuries, sailors told the same strange story."
  s2: "At night, far from land, the whole sea began to glow like milk."
  s3: "The light was steady and silent, from horizon to horizon."
  s4: "Nobody believed them. There was no photograph, no proof."
  s5: "In 1995 a merchant ship crossed a glowing sea in the Indian Ocean."
  s6: "Ten years later, scientists found that same night in old satellite images."
  s7: "The glow covered more than fifteen thousand square kilometres."
  s8: "The light comes from bacteria, countless of them, shining together."
  s9: "In 2019 one milky sea glowed for more than forty nights."
  s10: "So what makes a whole sea switch on its light?"

gold:
  - {word: "1995", label: "1995", kind: stamp, top: 128, size: 120, stamp: {from: 2.4, r0: -14, r1: -4}}
  - {word: fifteen, label: "15 400 km²", kind: measure, points: [[398, 1452], [588, 1452]], label_at: [395, 1190], size: 64}
  - {word: s9/sea, label: "40 nights", kind: counter, top: 112, size: 112, dur: 0.95, until: "scene.end-0.05"}
  - {word: s10/its, label: "WHAT LIGHTS|THE SEA?", kind: stamp, top: 92, size: 84, stamp: {from: 2.0, r0: -5, r1: -2}}

