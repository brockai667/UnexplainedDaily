title: Carancas 2007
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: C:\Users\damia\RiddleFactory\music\sneaky_snitch.mp3
loop: {at: "s10.end+0.55", dur: 1.3}

sentences:
  s1: September 2007. A fireball tears across the sky over a village in Peru.
  s2: The blast shatters windows a kilometre away.
  s3: It leaves a crater thirteen metres wide, filled with boiling water.
  s4: Six hundred villagers come to look.
  s5: Soon two hundred of them are sick.
  s6: Officials warn everyone to stay away from the rock.
  s7: But the rock is an ordinary meteorite. The poison was already there.
  s8: The groundwater is full of arsenic, and the hot stone turned it into steam.
  s9: "One doctor blamed something else: fear."
  s10: "So what made them sick: poison, or panic?"

