  - {word: thirteen, label: "13 m", kind: measure, points: [[244, 684], [476, 684]], label_at: [360, 645], size: 37, until: "word:Six-0.4"}
  - {word: Six, label: "600", kind: counter, top: 112, size: 124, until: "word:two-0.1"}
  - {word: two, label: "200", kind: stamp, top: 112, size: 124, until: "word:Officials-0.1"}
  - {word: s10/poison, label: "POISON|OR PANIC?", kind: stamp, top: 96, size: 86, stamp: {from: 2.0, r0: -8, r1: -3}}

