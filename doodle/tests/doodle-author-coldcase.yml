name: UnexplainedDaily Doodle Author

# COPY of .github/workflows/doodle-author.yml for ANOTHER repo (the one that holds the OPENROUTER_API_KEY secret). Place it there as
# .github/workflows/doodle-author.yml. It is not a workflow of this repo (it sits in doodle/tests/ and does not run here).
# The only differences: the new input `ref` and the checkout step, which fetches the code and the queue from brockai667/UnexplainedDaily.
#
# Writes NEW doodle episodes with a FREE OpenAI-compatible model (OpenRouter / Groq / NVIDIA NIM / Gemini): no Claude, no login, no human.
# It runs `doodle/batch.py --backend api` (doodle/BATCH.md, section "Backend api"): topic -> Wikipedia facts -> brief -> screenplay ->
# accept.py -> review of stills -> qa.py render -> doodle/queue/<NNN>-<slug>/. The daily publisher (doodle.yml) posts one queued episode a day.
#
# Secret (Settings > Secrets and variables > Actions of THIS repo): the API key of the provider you pick:
#   OPENROUTER_API_KEY | GROQ_API_KEY | NVIDIA_API_KEY | GEMINI_API_KEY
# commit = false (default): nothing is pushed, the result is only the artifact (review.jpg, logs, screenplay, mp4, batch_log.jsonl): look at it first.
# commit = true: doodle/queue + doodle/batch_log.jsonl are committed as "doodle-author: <topics>" and pushed to the branch `ref` of
# brockai667/UnexplainedDaily (ref must be a branch name). The default GITHUB_TOKEN only reaches the repo the workflow runs in, so for
# commit = true put a personal access token with contents: write on brockai667/UnexplainedDaily into the secret UNEXPLAINED_PUSH_TOKEN.
#
# The cron is deliberately NOT enabled: the first runs are manual. Planned schedule - add it under `on:` after a good manual run.
# NOTE: a scheduled run has no inputs, so it uses the defaults of the script below (openrouter, the default model, the next unused bank topic)
# and always commits; with an empty `ref` the checkout then takes the default branch of brockai667/UnexplainedDaily.
# One episode needs 10-30 minutes; the daily quota of the free model is the real limit.
#   schedule:
#     - cron: "15 2 * * *"   # 02:15 UTC every day
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch of brockai667/UnexplainedDaily that holds doodle/ (and receives the commit when commit is on)"
        type: string
        default: "doodle"
      provider:
        description: "API provider (its key comes from the secret of the same name, e.g. OPENROUTER_API_KEY)"
        type: choice
        options: [openrouter, groq, nim, gemini]
        default: openrouter
      model:
        description: "Model id of the provider for brief, author and fixes"
        type: string
        default: "nvidia/nemotron-3.5-super-vl:free"
      review_model:
        description: "Model id for the review of the stills (must understand images; empty = same as model)"
        type: string
        default: "nvidia/nemotron-3.5-super-vl:free"
      topics:
        description: "Topics separated by ; (a single name with commas: add a ; at the end). Empty = the next from_bank unused topics of the bank"
        type: string
        default: ""
      from_bank:
        description: "How many unused bank topics to do when topics is empty"
        type: number
        default: 1
      start:
        description: "First queue number NNN (empty = after the highest in doodle/queue and doodle/done)"
        type: string
        default: ""
      commit:
        description: "Commit + push doodle/queue and doodle/batch_log.jsonl (off = only upload the artifact)"
        type: boolean
        default: false
      extra:
        description: "Extra batch.py options, space-separated (e.g. --reasoning low --no-review)"
        type: string
        default: ""

permissions:
  contents: write            # only used by commit: true (push of doodle/queue + doodle/batch_log.jsonl)

concurrency:
  group: doodle-author
  cancel-in-progress: false

jobs:
  author:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # the code and the queue live in brockai667/UnexplainedDaily; this repo only holds the secrets. The token is used for the later push
      # (commit: true) and falls back to the default one, which is enough for reading a public repo.
      - uses: actions/checkout@v4
        with:
          repository: brockai667/UnexplainedDaily
          ref: ${{ inputs.ref }}
          token: ${{ secrets.UNEXPLAINED_PUSH_TOKEN || github.token }}

      # first, so a missing secret or a typo fails in seconds, not after the warm-up
      - name: Check key and inputs
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          START: ${{ inputs.start }}
        run: |
          P="${PROVIDER:-openrouter}"
          case "$P" in
            openrouter) KEY="$OPENROUTER_API_KEY" ;;
            groq)       KEY="$GROQ_API_KEY" ;;
            nim)        KEY="$NVIDIA_API_KEY" ;;
            gemini)     KEY="$GEMINI_API_KEY" ;;
            *) echo "::error::unknown provider '$P'"; exit 1 ;;
          esac
          echo "provider $P: key length ${#KEY}"
          if [ -z "$KEY" ]; then
            echo "::error::the secret of provider $P is empty - add it under Settings > Secrets and variables > Actions"
            exit 1
          fi
          if [ -n "$START" ] && ! echo "$START" | grep -Eq '^[0-9]+$'; then
            echo "::error::start must be a number or empty, got '$START'"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"      # hyperframes needs Node >= 22

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # sp.py: pyyaml numpy soundfile Pillow + voice (kokoro-onnx, faster-whisper); qa.py: numpy Pillow playwright;
      # verzie hlasu pripnute na tie z vyvojoveho PC: novsi PyAV (av) rozbil faster-whisper (open() bez metadata_errors, 1.10.2026)
      # batch.py queues through doodle/factory.py (load_meta), which imports requests + cloudinary like the publisher
      - name: Install Python deps
        run: pip install requests cloudinary kokoro-onnx==0.4.7 soundfile faster-whisper==1.2.1 av==17.1.0 numpy scipy Pillow pyyaml playwright

      # Kokoro (~350 MB) lands in <repo>/kokoro (doodle/engine/tts_kokoro.py), faster-whisper base.en in the HF cache:
      # without the cache both are downloaded on every run
      - name: Cache Kokoro + Whisper models
        uses: actions/cache@v4
        with:
          path: |
            kokoro
            ~/.cache/huggingface
          key: doodle-models-v1

      # hyperframes keeps its Chrome in ~/.cache/hyperframes (or puppeteer's); qa.py's DOM check uses Playwright's Chromium
      - name: Cache npx + Chrome
        uses: actions/cache@v4
        with:
          path: |
            ~/.npm
            ~/.cache/hyperframes
            ~/.cache/puppeteer
            ~/.cache/ms-playwright
          key: doodle-npx-v1

      - name: Warm up hyperframes + Playwright Chromium
        run: |
          HF=$(sed -n 's/^HF = "\(.*\)"$/\1/p' doodle/qa.py)     # the version qa.py runs (single source of truth)
          test -n "$HF"
          echo "hyperframes: $HF"
          npx --yes "$HF" browser ensure
          npx --yes "$HF" doctor || true
          python -m playwright install --with-deps chromium

      - name: Prepare config
        run: cp config.example.json config.json

      - name: Author episodes (backend api)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PROVIDER: ${{ inputs.provider }}
          MODEL: ${{ inputs.model }}
          REVIEW_MODEL: ${{ inputs.review_model }}
          TOPICS: ${{ inputs.topics }}
          FROM_BANK: ${{ inputs.from_bank }}
          START: ${{ inputs.start }}
          EXTRA: ${{ inputs.extra }}
        run: |
          MODEL="${MODEL:-nvidia/nemotron-3.5-super-vl:free}"
          ARGS=(--backend api --keep --provider "${PROVIDER:-openrouter}" --model "$MODEL" --review-model "${REVIEW_MODEL:-$MODEL}")
          # shellcheck disable=SC2206  # EXTRA is a space-separated list of extra batch.py options, e.g. "--reasoning low --no-review"
          if [ -n "$EXTRA" ]; then ARGS+=($EXTRA); fi
          if [ -n "$TOPICS" ]; then
            ARGS+=(--topics "$TOPICS")
          else
            FB="${FROM_BANK:-1}"
            ARGS+=(--from-bank "${FB%%.*}")
          fi
          if [ -n "$START" ]; then ARGS+=(--start "$START"); fi
          echo "batch.py ${ARGS[*]}"
          python doodle/batch.py "${ARGS[@]}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: doodle-author
          path: |
            doodle/episodes/*/review.jpg
            doodle/episodes/*/accept.log
            doodle/episodes/*/qa.log
            doodle/episodes/*/calls.json
            doodle/episodes/*/screenplay.yaml
            doodle/episodes/*/renders/*.mp4
            doodle/batch_log.jsonl
          if-no-files-found: warn
          retention-days: 14

      # also after a partly failed batch (exit 1): the episodes that are OK and the log lines of the FAILED ones belong in the repo
      - name: Commit the queue
        if: ${{ !cancelled() && (inputs.commit || github.event_name == 'schedule') }}
        env:
          TOPICS: ${{ inputs.topics }}
          FROM_BANK: ${{ inputs.from_bank }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p doodle/queue
          for p in doodle/queue doodle/batch_log.jsonl; do
            if [ -e "$p" ]; then git add "$p"; fi
          done
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "doodle-author: ${TOPICS:-bank x${FROM_BANK:-1}}"
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            echo "push failed (attempt $i), retrying"
            sleep 5
          done
          exit 1
