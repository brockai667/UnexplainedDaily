scenes:
- id: storm
  sents: [s1]
  camera: {zoom: 1.05, at: [360, 640], screen: [360, 640]}
  set:
  - {kind: shape, shape: nightsky, x: 0, y: 0}
  - {id: c1, kind: shape, shape: stormcloud, x: 130, y: 380, scale: 1.2}
  - {id: c2, kind: shape, shape: stormcloud, x: 430, y: 400, scale: 1.3}
  - {id: c3, kind: shape, shape: stormcloud, x: 700, y: 420, scale: 1.1}
