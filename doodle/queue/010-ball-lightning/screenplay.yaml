  - {kind: shape, shape: houseR, x: 300, y: 880, scale: 0.75}
  - {id: chu, kind: shape, shape: church, x: 600, y: 880, scale: 0.95}
  - {kind: shape, shape: streetground, x: 0, y: 880}
  props:
  - {id: bolt1, kind: shape, shape: bolt, x: 520, y: 640, scale: 0.55, hidden: true}
  - {id: light, kind: shape, shape: orb, x: 270, y: 540, scale: 1.5, hidden: true}
  cast:
  - {id: v1, x: 160, gy: 880, k: 1.2, facing: r, coat: "#6b705c", coat_len: 22, hair: "#3b2a1e", face: curious, hidden: true}
  - {id: v2, x: 360, gy: 880, k: 1.1, facing: l, coat: "#7f5539", coat_len: 18, hair: "#6d4c41", face: curious, hidden: true}
  beats:
  - {at: scene+0.05, who: cam, do: push, zoom: 1.25, target: [300, 620], screen: [360, 640], until: scene.end, ease: sine.inOut}
  - {at: scene+0.1, who: c1, do: bob, amp: 6, freq: 0.6, until: scene.end}
  - {at: scene+0.1, who: c2, do: bob, amp: 8, freq: 0.5, until: scene.end}
  - {at: scene+0.1, who: c3, do: bob, amp: 6, freq: 0.7, until: scene.end}
  - {at: "word:thunderclouds-0.1", who: bolt1, do: pop, dur: 0.1, sfx: [boom, 0.35]}
  - {at: "word:thunderclouds", who: fx, do: flash, peak: 0.6}
  - {at: "word:thunderclouds+0.25", who: bolt1, do: fade, to: 0, dur: 0.15}
  - {at: "word:centuries", who: chu, do: jiggle, amp: 0.02}
  - {at: scene+0.3, who: v1, do: show}
  - {at: prev, who: v1, do: enter, from: -90, to: 160, dur: 0.7}
  - {at: scene+0.4, who: v2, do: show}
  - {at: prev, who: v2, do: enter, from: 820, to: 360, dur: 0.7}
  - {at: "word:describe", who: v1, do: face, name: wow}
  - {at: "word:strange-0.15", who: light, do: pop, dur: 0.3, sfx: [tick, 0.4]}
  - {at: "word:strange", who: v1, do: point, target: [270, 520]}
  - {at: "word:strange+0.05", who: v2, do: look, target: [270, 520]}
  - {at: "word:strange+0.1", who: v2, do: face, name: wow}
  - {at: "word:strange", who: light.rays, do: spin, speed: 40, until: scene.end}
  - {at: "word:light", who: light, do: pulse, amp: 0.08, freq: 3, until: scene.end}
  check:
  - {thing: "the thunderclouds", ids: [c2], word: "thunderclouds"}
  - {thing: "the villagers", ids: [v1, v2], word: "describe"}
  - {thing: "the strange light", ids: [light], word: "light"}
