title: "Ball Lightning"
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s11.end+0.55", dur: 1.3}
sentences:
  s1: "Under thunderclouds, for centuries, people describe a strange light."
  s2: "It is a glowing ball, sometimes as small as a pea."
  s3: "Sometimes it is several meters wide."
  s4: "For a split second, a lightning bolt flashes."
  s5: "But witnesses say the ball lasts far longer."
  s6: "Some reports say it explodes, leaving a smell of sulfur behind."
  s7: "In January 2014, a light spectrum of what seems to be ball lightning is published."
  s8: "It comes with a high speed video."
  s9: "Still, scientific data remain scarce."
  s10: "In laboratories, experiments create effects that look similar."
  s11: "But how they relate to real ball lightning remains unclear."
gold:
  - {word: centuries, label: CENTURIES, kind: stamp, top: 118, size: 96, until: "s1.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: split, label: "SPLIT SECOND", kind: stamp, top: 118, size: 80, until: "s4.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: sulfur, label: SULFUR, kind: stamp, top: 118, size: 100, until: "s6.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: "2014", label: "2014", kind: counter, top: 112, size: 112, dur: 0.9, until: "word:seems"}
  - {word: unclear, label: UNEXPLAINED, kind: stamp, top: 118, size: 80, until: "s11.end+0.6", stamp: {from: 2.2, r0: -10, r1: -4}}
