title: "Oumuamua"
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s9.end+0.55", dur: 1.3}
sentences:
  s1: "October 2017. On a mountain in Hawaii, a telescope spots a strange object."
  s2: "A physicist finds it, thirty three million kilometres from Earth."
  s3: "Forty days after passing the Sun, it is already flying away."
  s4: "Meet Oumuamua, the first confirmed visitor from interstellar space."
  s5: "It is red, up to one thousand metres long, and it tumbles."
  s6: "Near the Sun, comets grow a cloud. This one does not."
  s7: "Yet it speeds up, and gravity does not explain why."
  s8: "Maybe a broken comet, or a piece of a planet rich in nitrogen ice."
  s9: "It is leaving for good. Where it comes from, nobody knows."
gold:
  - {word: "2017", label: "2017", kind: stamp, top: 128, size: 120, until: "word:mountain", stamp: {from: 2.4, r0: -14, r1: -4}}
  - {word: thirty, label: "33 MILLION", kind: stamp, top: 118, size: 92, until: "s2.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: first, label: "FIRST EVER", kind: stamp, top: 118, size: 92, until: "s4.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: thousand, label: "1000", kind: counter, top: 112, size: 112, dur: 0.9, until: "s5.end"}
  - {word: "s9/nobody", label: "NOBODY KNOWS", kind: stamp, top: 118, size: 80, until: "s9.end+0.6", stamp: {from: 2.2, r0: -10, r1: -4}}
