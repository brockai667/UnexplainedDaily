scenes:
- id: dome
  sents: [s1]
  camera: {zoom: 1.0, at: [360, 620], screen: [360, 620]}
  set:
  - {kind: shape, shape: nightsky_milky_, x: 0, y: 0}
  - {kind: shape, shape: seadark, x: 0, y: 0}
  - {id: mnt, kind: shape, shape: mount, x: 360, y: 900}
  - {id: obs, kind: shape, shape: obsdome, x: 360, y: 575}
  - {id: palm1, kind: shape, shape: palm, x: 150, y: 710, scale: 0.9}
  - {id: palm2, kind: shape, shape: palm, x: 560, y: 690, scale: 0.8}
  props:
  - {id: glow, kind: shape, shape: glow, x: 555, y: 290, scale: 1.6, hidden: true}
  beats:
  - {at: scene+0.05, who: cam, do: push, zoom: 1.15, target: [360, 560], screen: [360, 600], until: 'word:object', ease: sine.inOut}
  - {at: scene+0.1, who: palm1, do: rock, amp: 0.03, freq: 1.1, until: scene.end}
  - {at: scene+0.1, who: palm2, do: rock, amp: 0.04, freq: 0.9, until: scene.end}
  - {at: 'word:mountain', who: mnt, do: pulse, amp: 0.03, freq: 2.5, until: 'word:Hawaii'}
  - {at: 'word:Hawaii', who: palm1, do: jiggle, amp: 0.12}
  - {at: 'word:Hawaii', who: palm2, do: jiggle, amp: 0.12}
  - {at: 'word:telescope-0.2', who: obs.tele, do: rotate, to: 50, dur: 1.0, ease: power2.inOut}
  - {at: 'word:telescope', who: obs, do: jiggle, amp: 0.03}
  - {at: 'word:spots', who: glow, do: pop, sfx: [tick, 0.4]}
  - {at: 'word:strange', who: glow, do: pulse, amp: 0.3, freq: 3, until: scene.end}
  - {at: 'word:object', who: fx, do: flash, peak: 0.2}
  - {at: 'word:object', who: glow, do: shake, amp: 3, dur: 0.4}
  check:
  - {thing: "the observatory dome with its telescope", ids: [obs], word: "mountain"}
  - {thing: "the palm trees", ids: [palm1, palm2], word: "Hawaii"}
  - {thing: "the strange glowing dot", ids: [glow], word: "object"}
