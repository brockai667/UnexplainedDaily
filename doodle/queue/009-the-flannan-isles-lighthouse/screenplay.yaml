  - {at: "word:Isles", who: kb, do: pose, name: wave, dur: 0.2, repeat: {every: 0.4, until: scene.end, alt: {name: stand}}}
  - {at: "word:lighthouse", who: kc, do: pose, name: wave, dur: 0.2, repeat: {every: 0.4, until: scene.end, alt: {name: stand}}}
