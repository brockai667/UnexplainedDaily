  cast:
  - {id: ka, x: 160, gy: 840, k: 1.0, cap: navy, coat: "#2f4858", coat_len: 20, face: happy, hidden: true}
  - {id: kb, x: 240, gy: 840, k: 1.0, cap: navy, coat: "#2f4858", coat_len: 20, face: happy, hidden: true}
  - {id: kc, x: 320, gy: 840, k: 1.0, cap: navy, coat: "#2f4858", coat_len: 20, face: happy, hidden: true}
