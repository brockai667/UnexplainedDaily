title: "The Flannan Isles Lighthouse"
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s10.end+0.55", dur: 1.3}
sentences:
  s1: "December 1900. Three keepers tend the Flannan Isles lighthouse, off Scotland."
  s2: "A passing steamer notes in her log that the light is out."
  s3: "On the twenty sixth, the relief ship Hesperus finally arrives."
  s4: "No flag flies, and nobody answers the ship's whistle."
  s5: "Alone, the relief keeper finds the gate and door closed."
  s6: "Inside, the beds are unmade, and the clock is unwound."
  s7: "The lamps are refilled, yet a set of oilskins is left behind."
  s8: "No keeper is anywhere on the island."
  s9: "At the west landing, the damage is hard to believe unless seen."
  s10: "They are never found, and nobody knows what happened."
gold:
  - {word: "1900", label: "1900", kind: stamp, top: 128, size: 120, until: "word:tend", stamp: {from: 2.4, r0: -14, r1: -4}}
  - {word: twenty, label: "26", kind: counter, top: 112, size: 112, dur: 0.9, until: "word:ship"}
  - {word: "s4/nobody", label: NOBODY, kind: stamp, top: 118, size: 104, until: "s4.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: "s10/never", label: "NEVER FOUND", kind: stamp, top: 118, size: 88, until: "s10.end+0.6", stamp: {from: 2.2, r0: -10, r1: -4}}
