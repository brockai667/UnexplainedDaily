scenes:
- id: forest
  sents: [s1]
  camera: {zoom: 1.0, at: [360, 640], screen: [360, 640]}
  set:
  - {kind: shape, shape: daysky, x: 0, y: 0}
  - {kind: sky, clouds: [[130, 340, 140], [560, 420, 150]], drift: 10}
  - {id: sun, kind: shape, shape: sun, x: 560, y: 930, scale: 1.4}
  - {kind: shape, shape: meadow, x: 0, y: 880}
  - {id: f1, kind: shape, shape: pine, x: 70, y: 872, scale: 1.3}
  - {id: f2, kind: shape, shape: pine, x: 215, y: 884, scale: 1.7}
  - {id: hut, kind: shape, shape: hut, x: 370, y: 884, scale: 1.1}
  - {id: f4, kind: shape, shape: pine, x: 530, y: 886, scale: 1.9}
  - {id: f5, kind: shape, shape: pine, x: 670, y: 872, scale: 1.4}
  props:
  - {id: smk, kind: emitter, emitter: smoke, at: [430, 662], n: 8, r: [6, 12], color: gray, period: 2.6, rise: 120, drift: 20, spread: 6, s0: 0.6, s1: 1.8, opacity: 0.8, prewarm: true}
  - {id: birds, kind: emitter, emitter: birds, at: [700, 400], n: 4, dir: -1}
  beats:
  - {at: scene+0.05, who: sun, do: move, dy: -300, dur: 3.2, ease: sine.out}
  - {at: scene+0.05, who: smk, do: start}
  - {at: scene+0.1, who: cam, do: push, zoom: 1.12, target: [360, 620], screen: [360, 640], until: "word:Siberian", ease: sine.inOut}
  - {at: scene+0.2, who: f2, do: rotate, to: 2, dur: 0.9, repeat: {every: 0.9, until: scene.end, alt: {to: -2}}}
  - {at: scene+0.3, who: f4, do: rotate, to: -2, dur: 1.0, repeat: {every: 1.0, until: scene.end, alt: {to: 2}}}
  - {at: scene+0.4, who: f1, do: rotate, to: 2, dur: 1.1, repeat: {every: 1.1, until: scene.end, alt: {to: -2}}}
  - {at: scene+0.5, who: f5, do: rotate, to: -2, dur: 1.2, repeat: {every: 1.2, until: scene.end, alt: {to: 2}}}
  - {at: "word:Morning", who: sun, do: pulse, amp: 0.06, freq: 3, until: "word:quiet"}
  - {at: "word:Morning", who: birds, do: burst}
  - {at: "word:quiet", who: hut, do: jiggle, amp: 0.03, freq: 3}
  - {at: "word:Siberian", who: cam, do: pan, zoom: 1.2, target: [430, 600], screen: [360, 640], until: scene.end, ease: sine.inOut}
  - {at: "word:forest", who: f4, do: jiggle, amp: 0.04, freq: 4}
  - {at: "word:forest", who: f2, do: jiggle, amp: 0.04, freq: 4}
  check:
  - {thing: "the forest", ids: [f2, f4, f5], word: "forest"}
  - {thing: "the morning sun", ids: [sun], word: "Morning"}
  - {thing: "the Siberian pines", ids: [f1, f2, f4], word: "Siberian"}
