title: "The Tunguska Event"
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s10.end+0.55", dur: 1.3}
sentences:
  s1: "June 1908. Morning in the quiet Siberian forest."
  s2: "A stony asteroid, fifty or sixty meters wide, races in from the east."
  s3: "Five to ten kilometers above the ground, it explodes."
  s4: "The blast equals between three and fifty megatons of explosives."
  s5: "Trees fall across more than two thousand square kilometers."
  s6: "Witnesses say up to three people may have died."
  s7: "A blast like this could destroy a large city."
  s8: "It is the largest impact event in recorded history."
  s9: "Yet there is no crater, because it never hits the ground."
  s10: "So nobody can say for sure what it really was."
gold:
  - {word: "1908", label: "1908", kind: stamp, top: 128, size: 120, until: "s1.end", stamp: {from: 2.4, r0: -14, r1: -4}}
  - {word: megatons, label: MEGATONS, kind: stamp, top: 118, size: 100, until: "s4.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: crater, label: "NO CRATER", kind: stamp, top: 118, size: 94, until: "s9.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: nobody, label: UNKNOWN, kind: stamp, top: 118, size: 100, until: "s10.end+0.6", stamp: {from: 2.2, r0: -10, r1: -4}}
