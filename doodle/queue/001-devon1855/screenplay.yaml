scenes:
  # ------------------------------------------------ A (s1): snowy night, the dog goes home, the lamp goes out
  - id: night
    sents: [s1]
    set:
      - {kind: shape, shape: nightsky, x: 0, y: 0}
      - {kind: shape, shape: nightsky, x: 2400, y: 0}
      - {kind: shape, shape: snowland, x: 0, y: 822}
      - {id: church, kind: shape, shape: church, x: 350, y: 826, scale: 0.8}
      - {id: cotL, kind: shape, shape: cottage, x: 170, y: 874, scale: 0.72}
      - {id: cotR, kind: shape, shape: cottage, x: 505, y: 888, scale: 1.12}
      - {id: lamp, kind: shape, shape: lampwin, x: 571, y: 765, scale: 1.12}
      - {kind: shape, shape: snowland, x: 0, y: 898}
      - {id: tree, kind: shape, shape: tree, x: 44, y: 904, scale: 1.1}
    props:
      - {id: dog, kind: shape, shape: dog, x: -90, y: 912, scale: 0.9}
      - {id: snow1, kind: emitter, emitter: dust, at: [380, -120], n: 70, r: [3, 7], color: white, period: 5, rise: -1150, drift: 90, spread: 980, s0: 1, s1: 1, opacity: 0.95, prewarm: true, layer: top}
      - {id: snow2, kind: emitter, emitter: dust, at: [460, 330], n: 50, r: [3, 6], color: white, period: 3.2, rise: -700, drift: 70, spread: 640, s0: 0.4, s1: 1, opacity: 0.95, layer: top}
    beats:
      - {at: 0, who: tree.crown, do: rotate, to: 6, dur: 0.55, ease: sine.inOut, repeat: {every: 0.55, until: "scene.end", cycle: [{to: 6}, {to: 1}, {to: 13}, {to: 3}]}}
      - {at: 0, who: dog, do: move, to: [300, 912], until: "word:Devon", ease: none}
      - {at: 0, who: dog.legf, do: rotate, to: 26, dur: 0.11, repeat: {every: 0.11, until: "word:England", alt: {to: -26}}}
      - {at: 0, who: dog.legb, do: rotate, to: -26, dur: 0.11, repeat: {every: 0.11, until: "word:England", alt: {to: 26}}}
      - {at: 0, who: dog.tail, do: rotate, to: 24, dur: 0.16, repeat: {every: 0.16, until: "word:England+0.3", alt: {to: -12}}}
      - {at: 1.2, who: cam, do: push, zoom: 1.3, target: [460, 770], until: "word:Overnight", ease: sine.inOut}
      - {at: "word:Devon", who: dog, do: move, to: [430, 890], until: "word:England", ease: none}
      - {at: "word:England-0.25", who: cotR.door, do: fade, to: 0, dur: 0.12, sfx: [thud, 0.3]}
      - {at: "word:England+0.02", who: dog, do: scale, to: 0.55, dur: 0.28}
      - {at: prev, who: dog, do: fade, to: 0, dur: 0.28}
      - {at: "prev.end+0.12", who: cotR.door, do: fade, to: 1, dur: 0.1, sfx: [thud, 0.45]}
      - {at: "word:Overnight", who: lamp.glow, do: fade, to: 0, dur: 0.35}
      - {at: "word:Overnight", who: cam, do: push, zoom: 1.85, target: [450, 790], until: "scene.end", ease: sine.inOut}
      - {at: "word:heavy-0.15", who: snow2, do: emit}
      - {at: "word:heavy", who: cotR.cap, do: scale, to: 1.14, until: "word:county", ease: sine.inOut}
      - {at: prev, who: cotL.cap, do: scale, to: 1.14, until: "word:county", ease: sine.inOut}
      - {at: "word:snow", who: cotR.sill, do: scale, to: 1.2, until: "word:county", ease: sine.inOut}

  # ------------------------------------------------ B (s2): bright morning, the woman finds the prints
  - id: yard
    sents: [s2]
    in: {type: flash}
    camera: {zoom: 1.12, at: [320, 700]}
    set:
      - {kind: shape, shape: daysky, x: 0, y: 0}
      - {id: sun, kind: shape, shape: sun, x: 560, y: 300}
      - {kind: shape, shape: snowland, x: 0, y: 872}
      - {id: cot, kind: shape, shape: cottage, x: 250, y: 880, scale: 2.0}
      - {kind: shape, shape: snowland, x: -40, y: 896}
    props:
      - {id: p1, kind: shape, shape: hoofp, x: 180, y: 902, hidden: true}
      - {id: p2, kind: shape, shape: hoofp, x: 236, y: 902, hidden: true}
      - {id: p3, kind: shape, shape: hoofp, x: 292, y: 902, hidden: true}
      - {id: p4, kind: shape, shape: hoofp, x: 348, y: 902, hidden: true}
      - {id: p5, kind: shape, shape: hoofp, x: 404, y: 902, hidden: true}
      - {id: p6, kind: shape, shape: hoofp, x: 460, y: 902, hidden: true}
