      - {id: p8, kind: shape, shape: hoofp, x: 572, y: 902, hidden: true}
      - {id: p9, kind: shape, shape: hoofp, x: 628, y: 902, hidden: true}
      - {id: bucket, kind: shape, shape: bucket, x: 0, y: 0, on: wom, anchor: hand, hidden: true, layer: top}
      - {id: call, kind: emitter, emitter: sound, on: wom, dir: -20}
    cast:
      - {id: nb, x: 505, gy: 900, k: 1.0, facing: l, cap: "#5d4037", coat: "#52796f", coat_len: 14, hair: "#3b2a1e", hidden: true}
      - {id: wom, x: 114, gy: 890, k: 0.95, hair: "#6d4c41", coat: "#b56576", coat_len: 36, face: sleep, hidden: true}
    beats:
      - {at: scene, who: sun.rays, do: spin, speed: 35}
      - {at: "scene+0.08", who: cot.door, do: fade, to: 0, dur: 0.12, sfx: [thud, 0.35]}
      - {at: "scene+0.14", who: wom, do: show}
      - {at: prev, who: bucket, do: show}
      - {at: prev, who: wom, do: walk_to, to: 232, dur: 0.4}
      - {at: "word:the", who: cam, do: push, zoom: 1.75, target: [330, 760], screen: [360, 600], dur: 0.6, ease: power2.inOut}
      - {at: "word:morning+0.16", who: wom, do: pose, name: hands_up, dur: 0.2}
      - {at: prev, who: wom, do: face, name: happy}
      - {at: "word:people+0.09", who: wom, do: pose, name: stand, dur: 0.12}
      - {at: "prev.end", who: wom, do: walk_to, to: 348, dur: 0.36}
      - {at: "word:trail-0.12", who: wom, do: look, target: down}
      - {at: prev, who: wom, do: face, name: curious}
      - {at: "word:trail-0.24", who: p1, do: pop, dur: 0.14, sfx: [tick, 0.4], repeat: {every: 0.085, n: 9, cycle: [{who: p1}, {who: p2}, {who: p3}, {who: p4}, {who: p5}, {who: p6}, {who: p7}, {who: p8}, {who: p9}]}}
      - {at: "word:hoof", who: wom, do: face, name: wow}
      - {at: prev, who: wom, do: pose, name: cheeks, dur: 0.15}
      - {at: prev, who: bucket, do: detach}
      - {at: prev, who: bucket, do: move, to: [300, 884], dur: 0.25, ease: power2.in}
      - {at: prev, who: bucket, do: rotate, to: -95, dur: 0.25, sfx: clatter}
      - {at: "word:prints", who: wom, do: pose, name: wave, dur: 0.12}
      - {at: prev, who: wom, do: face, name: shout}
      - {at: prev, who: call, do: emit, until: "word:snow"}
      - {at: "word:hoof+0.05", who: nb, do: show}
      - {at: prev, who: nb, do: enter, from: right, to: 505, until: "word:the#2+0.05", stride: 150, lift: 26}
      - {at: "word:snow-0.1", who: nb, do: bend_over}
      - {at: prev, who: wom, do: bend_over}
      - {at: prev, who: nb, do: face, name: wow}
      - {at: prev, who: cam, do: push, zoom: 2.5, target: [410, 880], screen: [360, 640], until: "scene.end", ease: sine.inOut}

