  - {id: t1, x: 660, gy: 770, k: 0.4, facing: l, coat: '#3d5a80', hair: '#3b2a1e', face: ok}
  beats:
  - {at: scene+0.1, who: cam, do: pan, zoom: 1.1, target: [330, 560], screen: [360, 640], until: "word:monkey", ease: sine.inOut}
  - {at: scene+0.1, who: t1, do: enter, from: 900, to: 660, until: "word:animals", stride: 120, lift: 18}
  - {at: scene+0.2, who: t2, do: enter, from: -100, to: 380, until: "word:animals", stride: 120, lift: 18}
  - {at: "word:seventy", who: t1, do: face, name: wow}
  - {at: "word:animals", who: t2, do: look, target: [190, 480]}
  - {at: "word:hummingbird", who: hbf, do: pop, sfx: [tick, 0.4]}
  - {at: "word:hummingbird+0.2", who: hbf, do: jiggle, amp: 0.05}
  - {at: "word:hummingbird", who: t2, do: point, target: [190, 480]}
  - {at: "word:monkey", who: mkf, do: pop, sfx: [tick, 0.4]}
  - {at: "word:monkey+0.2", who: mkf, do: jiggle, amp: 0.05}
  - {at: "word:monkey", who: t1, do: look, target: [520, 650]}
  - {at: "word:monkey", who: cam, do: pan, zoom: 1.1, target: [420, 740], screen: [360, 640], until: scene.end, ease: sine.inOut}
  - {at: "word:condor", who: cdf, do: pop, sfx: [tick, 0.4]}
  - {at: "word:condor+0.2", who: cdf, do: jiggle, amp: 0.05}
