scenes:
- id: desert
  sents: [s1]
  camera: {zoom: 1.0, at: [360, 640], screen: [360, 640]}
  set:
  - {kind: shape, shape: daysky, x: 0, y: 0}
  - {kind: sky, clouds: [[120, 330, 120], [560, 300, 110]], drift: 10}
  - {id: dsrt, kind: shape, shape: desert, x: 0, y: 0}
  - {id: ln, kind: line, points: [[-100, 905], [300, 880], [800, 820]], style: ink, width: 16, color: "#f3e3b5"}
  cast:
  - {id: p3, x: 400, gy: 880, k: 0.9, coat: '#386641', hair: '#3b2a1e', face: ok}
  - {id: p2, x: 260, gy: 890, k: 0.95, coat: '#b56576', coat_len: 30, hair: '#6d4c41', face: ok}
  - {id: p1, x: 120, gy: 900, k: 1.0, coat: '#3d5a80', hair: '#3b2a1e', face: ok}
  beats:
  - {at: scene+0.05, who: cam, do: push, zoom: 1.25, target: [420, 760], screen: [360, 640], until: "word:desert", ease: sine.inOut}
  - {at: scene+0.1, who: p1, do: enter, from: -120, to: 120, until: "word:thousand", stride: 150, lift: 24}
  - {at: scene+0.2, who: p2, do: enter, from: -260, to: 260, until: "word:thousand", stride: 150, lift: 24}
  - {at: scene+0.3, who: p3, do: enter, from: -400, to: 400, until: "word:years", stride: 150, lift: 24}
  - {at: "word:people", who: ln, do: draw_line, dur: 2.2, ease: none}
  - {at: "word:people", who: p1, do: walk_to, to: 300, dur: 2.0}
  - {at: "word:people+0.1", who: p2, do: walk_to, to: 480, dur: 2.0}
  - {at: "word:people+0.2", who: p3, do: walk_to, to: 620, dur: 2.0}
  - {at: "word:draw", who: p1, do: point, target: [760, 840]}
  - {at: prev, who: p1, do: face, name: happy}
  - {at: "word:draw", who: p2, do: face, name: curious}
  - {at: "word:desert", who: p3, do: look, target: [900, 760]}
  - {at: "word:desert", who: p2, do: face, name: wow}
  - {at: "word:desert", who: cam, do: pan, zoom: 1.2, target: [560, 770], screen: [360, 640], until: scene.end, ease: sine.inOut}
  check:
  - {thing: "the desert", ids: [dsrt, ln], word: "draw"}
  - {thing: "the people", ids: [p1, p2, p3], word: "people"}
  - {thing: "the long line", ids: [ln], word: "draw"}
- id: pebbles
  sents: [s2]
  in: {type: slide}
  camera: {zoom: 1.0, at: [360, 640], screen: [360, 640]}
  set:
  - {kind: shape, shape: daysky, x: 0, y: 0}
  - {id: gnd, kind: shape, shape: closeup, x: 0, y: 0}
  props:
  - {id: pa1, kind: shape, shape: patch, x: 90, y: 800, hidden: true}
  - {id: pa2, kind: shape, shape: patch, x: 200, y: 800, hidden: true}
  - {id: pa3, kind: shape, shape: patch, x: 310, y: 800, hidden: true}
  - {id: pa4, kind: shape, shape: patch, x: 420, y: 800, hidden: true}
  - {id: pa5, kind: shape, shape: patch, x: 530, y: 800, hidden: true}
  - {id: pa6, kind: shape, shape: patch, x: 640, y: 800, hidden: true}
  - {id: pc1, kind: shape, shape: pebcl, x: 200, y: 800, scale: 1.2}
  - {id: pc2, kind: shape, shape: pebcl, x: 360, y: 800, scale: 1.2}
  - {id: pc3, kind: shape, shape: pebcl, x: 520, y: 800, scale: 1.2}
  - {id: bd, kind: shape, shape: board, x: 130, y: 830, scale: 1.2, layer: top}
  - {id: dust, kind: emitter, emitter: dust, at: [200, 800], n: 10, r: [3, 6], color: "#6b4533", period: 1.0, rise: 40, drift: 30, spread: 60, s0: 1, s1: 0.5, opacity: 0.7}
  cast:
  - {id: sw, x: 60, gy: 770, k: 1.3, coat: '#3d5a80', hair: '#3b2a1e', face: ok}
  beats:
  - {at: scene+0.1, who: cam, do: pan, zoom: 1.12, target: [340, 760], screen: [360, 640], until: scene.end, ease: sine.inOut}
  - {at: "word:they", who: sw, do: pose, name: lean_in, dur: 0.2}
  - {at: "word:remove", who: sw, do: walk_to, to: 700, dur: 2.9}
  - {at: "word:remove", who: bd, do: move, dx: 110, dy: 0, dur: 0.5, repeat: {every: 0.5, n: 6}}
  - {at: "word:remove", who: dust, do: emit, until: "word:showing"}
  - at: "word:pebbles"
    who: pa1
    do: pop
    dur: 0.15
    sfx: [tick, 0.3]
    repeat:
      every: 0.45
      n: 6
      cycle:
      - {who: pa1}
      - {who: pa2}
      - {who: pa3}
      - {who: pa4}
      - {who: pa5}
      - {who: pa6}
  - {at: "word:pebbles", who: pc1, do: path, points: [[200, 800], [190, 700], [140, 720], [100, 640]], dur: 0.6, ease: power2.out}
  - {at: "word:and", who: pc2, do: path, points: [[360, 800], [350, 700], [300, 720], [270, 640]], dur: 0.6, ease: power2.out}
  - {at: "word:leave", who: pc3, do: path, points: [[520, 800], [510, 700], [460, 720], [430, 640]], dur: 0.6, ease: power2.out}
  - {at: "word:dark", who: pc1, do: pulse, amp: 0.1, freq: 3, until: "word:pebbles"}
  - {at: "word:pale", who: pa6, do: pulse, amp: 0.08, freq: 3, until: "word:showing"}
  - {at: "word:soil", who: sw, do: face, name: happy}
  check:
  - {thing: "the dark pebbles", ids: [gnd, pc1, pc2, pc3], word: "dark"}
  - {thing: "the pale soil", ids: [pa1, pa2, pa3, pa4, pa5, pa6], word: "showing"}
  - {thing: "the worker", ids: [sw], word: "remove"}
- id: depth
  sents: [s3]
  in: {type: slide}
  camera: {zoom: 1.0, at: [360, 640], screen: [360, 640]}
  set:
  - {kind: shape, shape: daysky, x: 0, y: 0}
  - {id: sunn, kind: shape, shape: sun, x: 610, y: 430, scale: 0.9}
  - {id: sec, kind: shape, shape: section, x: 360, y: 700}
  props:
  - {id: rul, kind: shape, shape: ruler, x: 470, y: 440, scale: 1.3, rot: 90}
  - {id: arr, kind: shape, shape: arrow_down, x: 360, y: 540, scale: 0.9, hidden: true}
  cast:
  - {id: fg, x: 150, gy: 640, k: 1.2, coat: '#386641', hair: '#3b2a1e', face: ok}
  beats:
  - {at: scene+0.1, who: fg, do: enter, from: -100, to: 150, until: "word:lines", stride: 150, lift: 24}
  - {at: "word:the", who: sunn, do: spin, speed: 20, until: scene.end}
  - {at: "word:lines", who: fg, do: look, target: [360, 680]}
  - {at: "word:lines", who: sec, do: pulse, amp: 0.01, freq: 2, until: "word:only"}
  - {at: "word:only", who: fg, do: kneel_down, target: [360, 650]}
  - {at: "word:only", who: cam, do: push, zoom: 1.5, target: [360, 690], screen: [360, 640], until: scene.end, ease: sine.inOut}
  - {at: "word:few", who: fg, do: face, name: curious}
  - {at: "word:inches", who: rul, do: move, to: [470, 640], dur: 0.5, ease: back.out(1.4), sfx: [whoosh, 0.3]}
  - {at: "word:inches+0.5", who: rul, do: jiggle, amp: 0.06}
  - {at: "word:deep-0.1", who: arr, do: pop, sfx: [tick, 0.4]}
  - {at: "word:deep", who: arr, do: bob, amp: 10, freq: 3, until: scene.end}
  - {at: "word:deep", who: fg, do: face, name: wow}
  check:
  - {thing: "the shallow groove", ids: [sec], word: "deep"}
  - {thing: "the ruler", ids: [rul], word: "deep"}
  - {thing: "the observer", ids: [fg], word: "only"}
- id: length
  sents: [s4]
  in: {type: slide}
  camera: {zoom: 1.8, at: [360, 640], screen: [360, 640]}
  set:
  - {kind: shape, shape: daysky, x: 0, y: 0}
  - {id: mp, kind: shape, shape: mapboard, x: 360, y: 600}
  - {id: l1, kind: line, points: [[250, 470], [640, 410]], style: ink, width: 9, color: "#fff3cf"}
  - {id: l2, kind: line, points: [[260, 740], [620, 780]], style: ink, width: 9, color: "#fff3cf"}
  - {id: l3, kind: line, points: [[330, 380], [420, 820]], style: ink, width: 9, color: "#fff3cf"}
  - {id: l4, kind: line, points: [[470, 400], [520, 800]], style: ink, width: 9, color: "#fff3cf"}
  cast:
  - {id: wk, x: 250, gy: 662, k: 0.4, coat: '#3d5a80', hair: '#3b2a1e', face: curious}
  beats:
  - {at: scene+0.1, who: wk, do: walk_to, to: 620, dur: 3.0}
  - {at: "word:together", who: l1, do: draw_line, dur: 0.6}
  - {at: "word:they", who: l2, do: draw_line, dur: 0.6}
  - {at: "word:stretch", who: l3, do: draw_line, dur: 0.6}
  - {at: "word:over", who: l4, do: draw_line, dur: 0.6}
  - {at: "word:stretch", who: cam, do: pull, zoom: 1.05, target: [360, 620], screen: [360, 640], dur: 1.8, ease: power2.inOut}
  - {at: "word:eight", who: wk, do: face, name: wow}
  - {at: "word:hundred", who: mp, do: pulse, amp: 0.015, freq: 3, until: "word:miles"}
  - {at: "word:miles", who: wk, do: point, target: [660, 640]}
  - {at: "word:miles", who: cam, do: pan, zoom: 1.15, target: [420, 620], screen: [360, 640], until: scene.end, ease: sine.inOut}
  - {at: "word:miles", who: l1, do: jiggle, amp: 0.03}
  check:
  - {thing: "the map", ids: [mp], word: "miles"}
  - {thing: "the many lines", ids: [l1, l2, l3, l4], word: "hundred"}
  - {thing: "the walker", ids: [wk], word: "over"}
- id: animals
