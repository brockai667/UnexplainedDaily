title: "The Nazca Lines"
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s10.end+0.55", dur: 1.3}
sentences:
  s1: "Southern Peru. For one thousand years, people draw in the desert."
  s2: "They remove dark pebbles and leave pale soil showing."
  s3: "The lines are only a few inches deep."
  s4: "Together they stretch over eight hundred miles."
  s5: "Over seventy are animals, like a hummingbird, a monkey and a condor."
  s6: "The shapes are usually one continuous line."
  s7: "They are best seen from the air."
  s8: "Drones have found several hundred new figures."
  s9: "Scholars see religious meaning, but they disagree on the purpose."
  s10: "Nobody knows for sure why they were drawn, or how many remain hidden."
gold:
  - {word: thousand, label: "1000 YEARS", kind: stamp, top: 118, size: 96, until: "s1.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: eight, label: "800", kind: counter, top: 112, size: 112, dur: 0.9, until: "s4.end"}
  - {word: seventy, label: "70", kind: counter, top: 112, size: 112, dur: 0.9, until: "s5.end"}
  - {word: "s10/nobody", label: "NO ONE KNOWS", kind: stamp, top: 118, size: 80, until: "s10.end+0.6", stamp: {from: 2.2, r0: -10, r1: -4}}
styles:
