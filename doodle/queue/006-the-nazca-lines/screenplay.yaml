  in: {type: slide}
  camera: {zoom: 1.0, at: [360, 640], screen: [360, 640]}
  set:
  - {kind: shape, shape: daysky, x: 0, y: 0}
  - {id: fld, kind: shape, shape: airfield, x: 0, y: 0}
  props:
