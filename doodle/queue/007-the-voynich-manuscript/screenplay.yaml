  - {id: shelf, kind: shape, shape: shelf, x: 175, y: 520, scale: 1.4}
  - {id: tab, kind: shape, shape: table, x: 185, y: 760, scale: 1.1}
  props:
  - {id: beaker1, kind: shape, shape: beaker, x: 120, y: 760, scale: 1.1}
  - {id: beaker2, kind: shape, shape: beaker, x: 250, y: 760, scale: 1.1}
  - {id: bub, kind: emitter, emitter: bubbles, at: [250, 690], n: 8, r: [4, 9], color: white, period: 1.4, rise: 60, spread: 20, drift: 0}
