title: "The Voynich Manuscript"
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s10.end+0.55", dur: 1.3}
sentences:
  s1: "Possibly Italy, between 1404 and 1438. Someone writes a book in a strange script."
  s2: "The book has about two hundred forty pages."
  s3: "They are full of unknown plants, astrological symbols, and people."
  s4: "Some pages unfold into larger sheets."
  s5: "The first confirmed owner is Georg Baresch, an alchemist from Prague."
  s6: "In 1912 a Polish book dealer named Wilfrid Voynich buys it."
  s7: "Codebreakers from both world wars try to crack it and fail."
  s8: "Since 1969 it rests at Yale University, and since 2020 it is online."
  s9: "Is it a code, a lost language, or a hoax?"
  s10: "Nobody has ever deciphered it."
gold:
  - {word: "1404", label: "1404", kind: stamp, top: 128, size: 120, until: "s1.end", stamp: {from: 2.4, r0: -14, r1: -4}}
  - {word: two, label: "240", kind: counter, top: 112, size: 112, dur: 0.9, until: "s2.end"}
  - {word: "1912", label: "1912", kind: stamp, top: 128, size: 120, until: "s6.end", stamp: {from: 2.4, r0: -14, r1: -4}}
  - {word: "s10/ever", label: "NEVER READ", kind: stamp, top: 118, size: 88, until: "s10.end+0.6", stamp: {from: 2.2, r0: -10, r1: -4}}
