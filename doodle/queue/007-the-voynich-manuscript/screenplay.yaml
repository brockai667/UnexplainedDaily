  - {at: prev, who: alch, do: enter, from: 800, to: 400, until: 'word:confirmed'}
  - {at: 'word:first', who: tome, do: show, sfx: [tick, 0.3]}
  - {at: 'word:owner', who: tome, do: pulse, amp: 0.05, freq: 3, until: 'word:alchemist'}
  - {at: 'word:Georg', who: alch, do: face, name: think}
  - {at: 'word:Baresch', who: alch, do: pose, name: scratch, dur: 0.3}
  - {at: 'word:alchemist', who: bub, do: emit, until: scene.end}
  - {at: 'word:alchemist', who: alch, do: nod, until: 'word:from'}
  - {at: 'word:alchemist', who: beaker1, do: jiggle, amp: 0.05}
  - {at: 'word:alchemist+0.2', who: beaker2, do: jiggle, amp: 0.05}
  - {at: 'word:from', who: cam, do: pan, zoom: 1.2, target: [520, 640], screen: [360, 640], until: scene.end, ease: sine.inOut}
  - {at: 'word:Prague', who: pwin, do: pulse, amp: 0.04, freq: 3, until: scene.end}
  - {at: 'word:Prague', who: alch, do: point, target: pwin}
  check:
  - {thing: "the alchemist", ids: [alch], word: "alchemist"}
  - {thing: "the old book", ids: [tome], word: "owner"}
  - {thing: "Prague in the window", ids: [pwin], word: "Prague"}
- id: dealer
