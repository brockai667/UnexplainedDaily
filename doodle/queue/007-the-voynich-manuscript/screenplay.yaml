  - {at: 'word:book', who: book, do: pulse, amp: 0.04, freq: 3, until: 'word:two'}
  - at: 'word:about'
    who: leaf1
    do: pop
    dur: 0.1
    sfx: [tick, 0.3]
    repeat:
      every: 0.17
      n: 8
      cycle:
      - {who: leaf1}
      - {who: leaf2}
      - {who: leaf3}
      - {who: leaf4}
      - {who: leaf5}
      - {who: leaf6}
      - {who: leaf7}
      - {who: leaf8}
  - {at: 'word:pages', who: book, do: jiggle, amp: 0.03}
  - {at: 'word:full', who: cam, do: push, zoom: 1.2, target: [420, 640], screen: [360, 640], until: scene.end, ease: sine.inOut}
  - {at: 'word:unknown', who: plant1, do: pop, sfx: [tick, 0.4]}
  - {at: 'word:plants', who: plant1, do: jiggle, amp: 0.08}
  - {at: 'word:astrological', who: rosette1, do: pop, sfx: [tick, 0.4]}
  - {at: 'word:symbols', who: rosette1, do: spin, speed: 50, until: scene.end}
  - {at: 'word:people', who: pool1, do: pop, sfx: [tick, 0.4]}
  - {at: 'word:people+0.1', who: pool1, do: bob, amp: 4, freq: 2, until: scene.end}
  check:
  - {thing: "the book", ids: [book], word: "book"}
  - {thing: "the plant", ids: [plant1], word: "plants"}
  - {thing: "the star symbol", ids: [rosette1], word: "symbols"}
  - {thing: "the person", ids: [pool1], word: "people"}
- id: foldout
  sents: [s4]
  in: {type: slide}
  camera: {zoom: 1.7, at: [135, 680], screen: [360, 640]}
  set:
  - {id: bg, kind: shape, shape: daysky, x: 0, y: 0}
  - {id: room, kind: shape, shape: room, x: 0, y: 0}
  - {id: table, kind: shape, shape: tabletop, x: 0, y: 0}
  props:
  - {id: f1, kind: shape, shape: panelA, x: 135, y: 830}
  - {id: f2, kind: shape, shape: panelB, x: 285, y: 830, hidden: true}
  - {id: f3, kind: shape, shape: panelA, x: 435, y: 830, hidden: true}
  - {id: f4, kind: shape, shape: panelB, x: 585, y: 830, hidden: true}
  beats:
  - {at: 'word:Some', who: f1, do: pulse, amp: 0.04, freq: 3, until: 'word:unfold'}
  - {at: 'word:pages', who: f1, do: jiggle, amp: 0.05}
  - {at: 'word:unfold-0.05', who: fx, do: lines, dur: 0.4, target: [360, 680]}
  - at: 'word:unfold'
    who: f2
    do: pop
    dur: 0.2
    sfx: [whoosh, 0.35]
    repeat:
      every: 0.28
      n: 3
      cycle:
      - {who: f2}
      - {who: f3}
      - {who: f4}
  - {at: 'word:unfold', who: cam, do: pull, zoom: 1.0, target: [360, 690], screen: [360, 640], until: 'word:larger', ease: power2.inOut}
  - {at: 'word:into', who: f1, do: rock, amp: 1.5, freq: 3, until: 'word:larger'}
  - {at: 'word:larger', who: f4, do: rock, amp: 2, freq: 3, until: scene.end}
  - {at: 'word:larger', who: f2, do: rock, amp: 2, freq: 3, until: scene.end}
  - {at: 'word:larger+0.1', who: f3, do: rock, amp: 2, freq: 3, until: scene.end}
  - {at: 'word:sheets', who: cam, do: shake, amp: 6, dur: 0.25}
  - {at: 'word:sheets', who: f4, do: pulse, amp: 0.03, freq: 3, until: scene.end}
  - {at: 'word:sheets+0.2', who: cam, do: move, zoom: 0.92, target: [360, 690], screen: [360, 640], until: scene.end, ease: sine.inOut}
  check:
