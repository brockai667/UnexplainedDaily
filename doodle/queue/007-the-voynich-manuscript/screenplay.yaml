  - {id: leaf4, kind: shape, shape: leaf, x: 72, y: 754, scale: 1.2, hidden: true}
  - {id: leaf5, kind: shape, shape: leaf, x: 68, y: 742, scale: 1.2, hidden: true}
  - {id: leaf6, kind: shape, shape: leaf, x: 72, y: 730, scale: 1.2, hidden: true}
