scenes:
- id: scribe
  sents: [s1]
  camera: {zoom: 1.1, at: [400, 660], screen: [360, 640]}
  set:
  - {id: bg, kind: shape, shape: daysky, x: 0, y: 0}
  - {id: room, kind: shape, shape: room, x: 0, y: 0}
  - {id: desk, kind: shape, shape: desk, x: 480, y: 850, scale: 1.15}
  props:
  - {id: win, kind: shape, shape: window, x: 150, y: 620, scale: 1.3, hidden: true}
  - {id: candle, kind: shape, shape: candle, x: 660, y: 631, scale: 1.0}
  - {id: book, kind: shape, shape: bookopen, x: 470, y: 631, scale: 1.3, hidden: true}
  - {id: sq1, kind: shape, shape: squig, x: 400, y: 570, hidden: true}
  - {id: sq2, kind: shape, shape: squig, x: 450, y: 530, hidden: true}
  - {id: sq3, kind: shape, shape: squig, x: 500, y: 490, hidden: true}
  - {id: sq4, kind: shape, shape: squig, x: 550, y: 450, hidden: true}
  - {id: sq5, kind: shape, shape: squig, x: 600, y: 410, hidden: true}
  cast:
  - {id: scribe, x: 200, gy: 850, k: 1.5, facing: r, coat: '#6d4c41', coat_len: 40, hair: '#3b2a1e', face: curious, hidden: true}
  beats:
  - {at: scene, who: candle.flame, do: rock, amp: 6, freq: 4}
  - {at: 'scene+0.05', who: scribe, do: show}
  - {at: prev, who: scribe, do: enter, from: -90, to: 200, until: 'word:between'}
  - {at: 'word:Possibly', who: win, do: pop, sfx: [tick, 0.4]}
  - {at: 'word:Italy', who: win, do: jiggle, amp: 0.06}
  - {at: 'word:1404', who: cam, do: push, zoom: 1.25, target: [330, 640], screen: [360, 640], until: 'word:Someone', ease: sine.inOut}
  - {at: 'word:1438', who: candle, do: jiggle, amp: 0.1}
  - {at: 'word:Someone', who: scribe, do: face, name: happy}
  - {at: 'word:writes', who: scribe, do: pose, name: lean_in, dur: 0.3}
  - {at: 'word:writes', who: book, do: pop, sfx: [tick, 0.4]}
  - at: 'word:writes+0.15'
    who: sq1
    do: pop
    dur: 0.12
    sfx: [tick, 0.3]
    repeat:
      every: 0.22
      n: 5
      cycle:
      - {who: sq1}
      - {who: sq2}
      - {who: sq3}
      - {who: sq4}
      - {who: sq5}
  - {at: 'word:book', who: book, do: pulse, amp: 0.06, freq: 3, until: 'word:strange'}
  - {at: 'word:strange', who: cam, do: push, zoom: 1.7, target: [470, 600], screen: [360, 640], until: 'word:script', ease: sine.inOut}
  - {at: 'word:script', who: scribe, do: face, name: wow}
  - {at: 'word:script+0.1', who: cam, do: pull, zoom: 1.1, target: [400, 660], screen: [360, 640], until: scene.end, ease: sine.inOut}
  check:
  - {thing: "the window with Italy", ids: [win], word: "Italy"}
  - {thing: "the scribe", ids: [scribe], word: "writes"}
  - {thing: "the book", ids: [book], word: "book"}
