title: "Derinkuyu"
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s10.end+0.55", dur: 1.3}
sentences:
  s1: "Cappadocia, Turkey, in ancient times. Beneath a quiet town, a whole city hides."
  s2: "Its name is Derinkuyu, also called Malakopi."
  s3: "It lies near the modern town of Derinkuyu, in Nevsehir Province."
  s4: "The city has many levels, one under the other."
  s5: "It reaches down about eighty-five metres."
  s6: "Up to twenty thousand people could shelter here."
  s7: "Their livestock and food stores fit inside too."
  s8: "It is the largest excavated underground city in Turkey."
  s9: "Yet it is only one of several underground complexes across Cappadocia."
  s10: "Why anyone dug so deep, the stone does not say."
