  - {word: metres, label: "85 METRES", kind: stamp, top: 118, size: 92, until: "s5.end", stamp: {from: 2.2, r0: -10, r1: -4}}
  - {word: twenty, label: "20000", kind: counter, top: 112, size: 112, dur: 0.9, until: "s6.end"}
  - {word: "s10/deep", label: "WHY SO DEEP", kind: stamp, top: 118, size: 88, until: "s10.end+0.6", stamp: {from: 2.2, r0: -10, r1: -4}}
