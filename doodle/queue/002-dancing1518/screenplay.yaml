# The Dancing Plague of 1518 - the whole episode as data (python sp.py episodes/dancing1518)
title: The Dancing Plague of 1518
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s10.end+0.55", dur: 1.3}

sentences:
  s1: July 1518. In Strasbourg, a woman called Frau Troffea starts to dance in the street.
  s2: There is no music. She dances for a week and cannot stop.
  s3: Her husband joins her. Soon more than thirty people are dancing.
  s4: By August the dancers number in the hundreds.
  s5: "The doctors order a cure: more dancing."
  s6: The city opens its guild halls and hires musicians.
  s7: It makes things worse, so the council bans dancing and music.
  s8: The dancers are led to a shrine in red shoes.
  s9: In September it simply stops.
  s10: Mass hysteria, or poisoned bread? Nobody knows.

gold:
  - {word: "1518", label: "1518", kind: stamp, top: 128, size: 120, until: "word:woman+0.3", stamp: {from: 2.4, r0: -14, r1: -4}}
  - {word: thirty, label: "30", kind: counter, top: 112, size: 124, dur: 1.1}
  - {word: hundreds, label: "400?", kind: stamp, top: 112, size: 124, until: "word:doctors+0.7", stamp: {from: 2.4, r0: -10, r1: -3}}
  - {word: s10/hysteria, label: "HYSTERIA|OR BREAD?", kind: stamp, top: 96, size: 86, stamp: {from: 2.0, r0: -8, r1: -3}}

