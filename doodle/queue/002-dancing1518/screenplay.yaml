scenes:
  # ---------------------------------------------------------------- A: the street, Frau Troffea dances alone
  - id: street
    sents: [s1, s2]
    set:
      - {kind: sky, clouds: [[120, 330, 110], [600, 300, 100]], drift: 8}
      - {id: minster, kind: shape, shape: minster, x: 360, y: 748}
      - {kind: house, x: 292, y: 750, w: 96, h: 78, wall: "#e9c46a"}
      - {kind: house, x: 432, y: 750, w: 96, h: 78, wall: "#a8dadc"}
      - {kind: shape, shape: street, x: 360, y: 930}
      - {id: homeL, kind: shape, shape: houseL, x: 100, y: 842}
      - {id: homeR, kind: shape, shape: houseR, x: 628, y: 842, scale: 0.94}
      - {id: night, kind: shape, shape: veil, x: 360, y: 460, opacity: 0}
      - {id: sun, kind: shape, shape: sun, x: -110, y: 340}
      - {id: moon, kind: shape, shape: moon, x: -110, y: 340}
    props:
      - {id: smoke, kind: emitter, emitter: smoke, at: [185, 318], rise: 70, r: [12, 20], opacity: 0.55, prewarm: true}
      - {id: birds, kind: emitter, emitter: birds, at: [560, 330], n: 3, dir: -1}
      - {id: basket, kind: shape, shape: basket, on: p1, anchor: hand, offset: [0, 4], layer: top}
      - {id: apples, kind: emitter, emitter: sparks, shape: apple, on: basket, anchor: center, n: 6, spread: 110, dir: -90, vmin: 160, vmax: 340, life: 1.0, floor: 40, layer: top}
      - {id: sw, kind: emitter, emitter: sweat, on: fra, layer: top}
      - {id: dazed, kind: emitter, emitter: stars, on: fra, layer: top}
      - {id: nomus, kind: shape, shape: nomusic, x: 360, y: 345, scale: 1.45, hidden: true, layer: top}
    cast:
      - {id: p2, x: 92, gy: 892, k: 1.1, hat: [teal, "#e9c46a"], coat: "#52796f", coat_len: 30, face: ok}
      - {id: p1, x: 590, gy: 892, k: 1.2, facing: l, hat: [orange, cream], face: ok}
      - {id: fra, x: 169, gy: 894, k: 1.55, coat: "#9d4edd", coat_len: 40, hat: [cream, pink], face: ok, hidden: true}
    beats:
      # opening: chimney smoke, birds, slow push; a passer-by strolls in from the left
      - {at: 0, who: smoke, do: emit}
      - {at: 0.2, who: birds, do: burst}
      - {at: 0, who: cam, do: push, zoom: 1.1, target: [360, 690], screen: [360, 650], dur: 5.5, ease: sine.inOut}
      - {at: 0, who: p2, do: enter, from: left, to: 92, until: "word:called+0.2", stride: 110, lift: 14}
      # the door bangs open and Frau Troffea walks out
      - {at: "word:Strasbourg-0.1", who: homeL.door, do: fade, to: 0, dur: 0.12}
      - {at: prev, who: homeL, do: jiggle, amp: 0.02}
      - {at: prev, who: cam, do: shake, amp: 5, dur: 0.2}
      - {at: "word:Strasbourg-0.1", who: fra, do: show}
      - {at: "word:Strasbourg", who: fra, do: walk_to, to: 312, dur: 1.68, stride: 120, lift: 16}
      - {at: "word:Troffea-0.3", who: p1, do: enter, from: right, to: 590, until: "word:starts+0.3", stride: 125, lift: 15}
      # she stops and listens ... then bursts into dance
      - {at: "word:Troffea", who: fra, do: face, name: curious}
      - {at: prev, who: fra, do: look, target: up}
      - {at: "word:starts", who: fra, do: face, name: happy}
      - {at: "word:starts+0.25", who: p2, do: face, name: wow}
      - {at: prev, who: p2, do: pose, name: cover}
      - {at: "word:starts+0.25", who: p1, do: startle}
      - {at: prev, who: p1, do: face, name: wow}
      - {at: "word:dance", who: cam, do: shake, amp: 6, dur: 0.25}
      - {at: "word:starts+0.00", who: fra, do: bob, amp: 8, freq: 1.8, until: "word:starts+0.55"}
      - {at: "word:starts+0.00", who: fra, do: rock, amp: 4, freq: 1.0, until: "word:starts+0.55"}
      - {at: "word:starts+0.14", who: fra, do: pose, name: wave, dur: 0.1}
      - {at: "word:dance+0.00", who: fra, do: bob, amp: 18, freq: 2.9, until: "word:dance+1.30"}
      - {at: "word:dance+0.00", who: fra, do: rock, amp: 8, freq: 1.6, until: "word:dance+1.30"}
      - {at: "word:dance+0.15", who: fra, do: pose, name: shrug, dur: 0.1}
      - {at: "word:dance+0.44", who: fra, do: pose, name: hands_up, dur: 0.1}
      - {at: "word:dance+0.75", who: fra, do: pose, name: wave, dur: 0.1}
      - {at: "word:dance+1.00", who: fra, do: pose, name: reach, dur: 0.1}
      - {at: "word:dance+0.58", who: fra, do: turn, facing: l}
      - {at: "word:dance+1.14", who: fra, do: turn, facing: r}
      - {at: "word:dance+0.18", who: fra, do: walk_to, to: 357, dur: 0.41, stride: 150, lift: 28}
      - {at: "word:dance+0.63", who: fra, do: walk_to, to: 267, dur: 0.41, stride: 150, lift: 28}
      - {at: "word:dance+1.08", who: fra, do: walk_to, to: 357, dur: 0.41, stride: 150, lift: 28}
      # the basket falls, apples roll
      - {at: "word:dance", who: basket, do: detach}
      - {at: prev, who: basket, do: move, to: [548, 838], dur: 0.4, ease: power2.in}
      - {at: prev, who: basket, do: rotate, to: 75, dur: 0.4, ease: power2.in}
      - {at: "word:dance+0.4", who: apples, do: burst}
      - {at: prev, who: cam, do: shake, amp: 5, dur: 0.18}
      # "no music": the crossed-out note slams in, the onlookers flinch
      - {at: "word:no", who: nomus, do: stamp, from: 2.2, r0: -14, r1: -5}
      - {at: prev, who: cam, do: shake, amp: 7, dur: 0.22}
      - {at: "word:no+0.05", who: p1, do: jump_back, dist: 26}
      - {at: "word:no+0.1", who: p2, do: tremble, amount: 1.2, until: "word:She"}
      - {at: "word:She", who: nomus, do: fade, to: 0, dur: 0.25}
      # sun and moon chase each other: a week flies by, she keeps dancing and tires
      - {at: "word:She", who: p1, do: look, target: up}
      - {at: prev, who: p2, do: look, target: up}
      - {at: "word:She", who: sw, do: emit, until: "word:week+1.4"}
      - {at: "word:week", who: fra, do: face, name: worried}
      - {at: "word:cannot-0.1", who: fra, do: face, name: dizzy}
      - {at: "word:cannot", who: fra, do: pose, name: kneel, dur: 0.25}
      - {at: "word:cannot", who: dazed, do: emit, until: "word:stop"}
      - {at: "word:cannot", who: p1, do: point, target: fra}
      - {at: prev, who: p2, do: point, target: fra}
      - {at: "word:stop", who: fra, do: pose, name: hands_up, dur: 0.12}
      - {at: prev, who: fra, do: face, name: shout}
      - {at: prev, who: cam, do: shake, amp: 7, dur: 0.25}
      - {at: "word:She-0.02", who: sun, do: move, to: [-110, 340], dur: 0.01}
      - {at: "word:She+0.00", who: sun, do: path, points: [[-110, 340], [150, 150], [570, 150], [830, 340]], dur: 0.72, ease: none}
      - {at: "word:She+0.58", who: sun, do: move, to: [-110, 340], dur: 0.01}
