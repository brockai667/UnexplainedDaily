  # ---------------------------------------------------------------- D: the doctors examine a dancer, confer, prescribe more dancing
  - id: doctors
    sents: [s5]
    in: {type: zoom, target: [640, 850], from: [360, 760]}
    camera: {zoom: 1.25, at: [360, 700], screen: [360, 640]}
    set:
      - {kind: sky, clouds: [[-100, 330, 120], [250, 300, 100], [650, 340, 130], [960, 300, 110]], drift: 8}
      - {id: minster, kind: shape, shape: minster, x: 480, y: 786, scale: 1.3}
      - {kind: shape, shape: houseR, x: -260, y: 784, scale: 0.55}
      - {kind: shape, shape: frame, x: -120, y: 784, scale: 0.65}
      - {kind: shape, shape: houseR, x: 20, y: 784, scale: 0.55}
      - {kind: shape, shape: frame, x: 160, y: 784, scale: 0.65}
      - {kind: shape, shape: houseR, x: 300, y: 784, scale: 0.55}
      - {kind: shape, shape: frame, x: 440, y: 784, scale: 0.65}
      - {kind: shape, shape: houseR, x: 580, y: 784, scale: 0.55}
      - {kind: shape, shape: frame, x: 720, y: 784, scale: 0.65}
      - {kind: shape, shape: houseR, x: 860, y: 784, scale: 0.55}
      - {kind: shape, shape: frame, x: 1000, y: 784, scale: 0.65}
      - {kind: shape, shape: plaza, x: 400, y: 930}
    cast:
      - {id: d1, x: 30, gy: 812, k: 0.8, facing: r, hat: [orange, cream]}
      - {id: d2, x: 140, gy: 812, k: 0.8, facing: l, hat: [teal, "#e9c46a"]}
      - {id: d3, x: 250, gy: 812, k: 0.8, facing: r, hat: [purple, "#ffbe0b"]}
      - {id: d4, x: 480, gy: 812, k: 0.8, facing: l, hat: [pink, white]}
      - {id: d5, x: 590, gy: 812, k: 0.8, facing: r, hat: [red, yellow]}
      - {id: d6, x: 690, gy: 812, k: 0.8, facing: l, hat: [blue, "#ffd166"]}
      - {id: pt, x: 360, gy: 896, k: 1.4, hair: "#c08a4f", coat: "#e07a5f", coat_len: 30, face: happy}
      - {id: doc1, x: 200, gy: 896, k: 1.5, facing: r, coat: "#1d1d2b", coat_len: 40, glasses: true, mirror: true, hair: "#9e9e9e", face: flat}
      - {id: doc2, x: 520, gy: 896, k: 1.5, facing: l, coat: "#7b2d26", coat_len: 40, glasses: true, stetho: true, hair: "#3b2a1e", face: flat}
    beats:
      # the doctors run in and examine the dancer
      - {at: scene, who: doc1, do: enter, from: left, to: 200, dur: 0.6, stride: 190, lift: 24}
      - {at: scene, who: doc2, do: enter, from: right, to: 520, dur: 0.6, stride: 190, lift: 24}
      - {at: "word:doctors+0.35", who: doc1, do: hold, prop: magnifier}
      - {at: prev, who: doc1, do: pose, name: lean_in, dur: 0.2}
      - {at: prev, who: doc1, do: look, target: pt}
      - {at: "word:doctors+0.35", who: doc2, do: pose, name: lean_in, dur: 0.2}
      - {at: prev, who: doc2, do: look, target: pt}
      # they confer
      - {at: "word:order+0.2", who: doc1, do: pose, name: think, dur: 0.2}
      - {at: prev, who: doc1, do: face, name: think}
      - {at: "word:order+0.25", who: doc2, do: pose, name: think, dur: 0.2}
      - {at: prev, who: doc2, do: face, name: think}
      - {at: "word:order+0.25", who: doc1, do: nod, until: "word:cure-0.12"}
      - {at: "word:order+0.3", who: doc2, do: nod, until: "word:cure-0.12"}
      # one raises a finger ...
      - {at: "word:cure-0.15", who: doc1, do: drop}
      - {at: "word:cure-0.12", who: doc1, do: point, target: up}
