title: "D. B. Cooper"
voice: {voice: am_michael, speed: 1.10, pause: 0.30}
tail: 2.0
music: sneaky_snitch.mp3
loop: {at: "s9.end+0.55", dur: 1.3}
sentences:
  s1: "November 1971. A man hijacks a plane flying from Portland to Seattle."
  s2: "He calls himself Dan Cooper and says he has a bomb."
  s3: "He demands two hundred thousand dollars and four parachutes."
  s4: "In Seattle, he lets the passengers go."
  s5: "Then he orders the crew to refuel and fly on to Mexico City."
  s6: "Over thick forest in Washington, he opens the rear door."
  s7: "He parachutes toward an uncertain fate."
  s8: "In 1980, six thousand dollars of the ransom is found beside the Columbia River."
  s9: "The rest of the money is never found, and nobody knows who he is."
gold:
  - {word: "1971", label: "1971", kind: stamp, top: 128, size: 120, until: "s1.end", stamp: {from: 2.4, r0: -14, r1: -4}}
  - {word: two, label: "200000", kind: counter, top: 112, size: 112, dur: 0.9, until: "s3.end"}
  - {word: "1980", label: "1980", kind: stamp, top: 128, size: 120, until: "s8.end", stamp: {from: 2.4, r0: -14, r1: -4}}
  - {word: never, label: "NEVER FOUND", kind: stamp, top: 118, size: 88, until: "s9.end+0.6", stamp: {from: 2.2, r0: -10, r1: -4}}
