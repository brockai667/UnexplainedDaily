  - {id: bomb, kind: shape, shape: bombicon, x: 377, y: 620, scale: 1.7, hidden: true}
  cast:
  - {id: stew, x: 560, gy: 900, k: 1.25, facing: l, coat: '#1d3557', coat_len: 36, hair: '#6d4c41', face: ok}
  - {id: man, x: 170, gy: 900, k: 1.3, coat: '#2b2d42', coat_len: 30, hair: '#1b1b1b', face: flat, hidden: true}
  beats:
  - {at: scene, who: man, do: show}
  - {at: prev, who: man, do: enter, from: -80, to: 170, until: "word:himself"}
  - {at: "word:himself", who: stew, do: look, target: man}
  - {at: "word:Dan", who: man, do: pose, name: lean_in, dur: 0.3}
  - {at: "word:Cooper", who: man, do: nod, until: "word:says"}
  - {at: "word:says", who: stew, do: face, name: worried}
  - {at: "word:says", who: cam, do: push, zoom: 1.35, target: [370, 560], screen: [360, 620], until: scene.end, ease: sine.inOut}
  - {at: "word:has-0.3", who: bub, do: pop, dur: 0.25, sfx: [tick, 0.4]}
  - {at: prev, who: bomb, do: pop, dur: 0.25}
  - {at: "word:has", who: stew, do: startle}
  - {at: prev, who: stew, do: pose, name: cheeks, dur: 0.2}
  - {at: prev, who: stew, do: face, name: scared}
  - {at: "word:bomb", who: bomb, do: jiggle, amp: 0.1, freq: 6}
  check:
  - {thing: "the bomb", ids: [bomb], word: "has"}
  - {thing: "the man", ids: [man], word: "Cooper"}
  - {thing: "the stewardess", ids: [stew], word: "says"}
