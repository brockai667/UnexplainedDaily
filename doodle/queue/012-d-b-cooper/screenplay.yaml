scenes:
- id: flight
  sents: [s1]
  camera: {zoom: 1.0, at: [360, 620], screen: [360, 640]}
  set:
  - {kind: shape, shape: dusk, x: 0, y: 0}
  - {kind: shape, shape: hills, x: 0, y: 0}
  - {id: cl1, kind: shape, shape: cloud, x: 560, y: 360, scale: 1.5}
  - {id: cl2, kind: shape, shape: cloud, x: 160, y: 450, scale: 1.1}
  - {id: cL, kind: shape, shape: towers, x: 120, y: 710, scale: 1.3, hidden: true}
  - {id: cR, kind: shape, shape: towers, x: 610, y: 700, scale: 1.3, hidden: true}
  - {kind: shape, shape: pinerow, x: 360, y: 830, scale: 0.8}
  props:
  - {id: jet, kind: shape, shape: jet, x: -330, y: 560, scale: 1.25}
  beats:
  - {at: scene+0.05, who: jet, do: move, to: [400, 520], until: scene.end, ease: sine.out}
  - {at: scene+0.05, who: cam, do: push, zoom: 1.2, target: [360, 580], screen: [360, 640], until: scene.end, ease: sine.inOut}
  - {at: scene, who: cl1, do: move, dx: -140, until: scene.end, ease: none}
  - {at: scene, who: cl2, do: move, dx: -90, until: scene.end, ease: none}
  - {at: "word:1971", who: fx, do: flash, peak: 0.3}
  - {at: "word:man", who: jet, do: jiggle, amp: 0.05, freq: 4}
  - {at: "word:hijacks", who: fx, do: lines, dur: 0.8, target: [360, 540]}
  - {at: "word:plane", who: jet, do: rotate, to: -4, dur: 0.5}
  - {at: "word:flying", who: jet, do: rotate, to: 0, dur: 0.5}
  - {at: "word:Portland-0.15", who: cL, do: pop, dur: 0.3, sfx: [tick, 0.3]}
  - {at: "word:Seattle-0.15", who: cR, do: pop, dur: 0.3, sfx: [tick, 0.3]}
  check:
  - {thing: "the plane", ids: [jet], word: "flying"}
  - {thing: "Portland", ids: [cL], word: "Portland"}
  - {thing: "Seattle", ids: [cR], word: "Seattle"}
- id: bomb
  sents: [s2]
  in: {type: slide}
  camera: {zoom: 1.15, at: [340, 700], screen: [360, 640]}
  set:
  - {kind: shape, shape: daysky, x: 0, y: 0}
  - {kind: shape, shape: cabin, x: 0, y: 0}
